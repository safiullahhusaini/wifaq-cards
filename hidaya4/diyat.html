<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>كتاب الديات · ہدایہ جلد رابع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
/* One kitab of a book. Two views on one page:
   فہرست (contents, styled like the book's own contents page: title … page) and a unit view (one bab/fasl,
   its cards, page chips). Recordings live in a bottom sheet behind the header button. */
:root {
  --paper: #FDFCFB; --surface: #FFFFFF; --ink: #1F1A1B; --muted: #6E6566; --rule: #E9E3E2;
  --matn: #A3211A; --matn-tint: #FBEDEB; --teacher: #17624C; --teacher-tint: #E3F2EC;
  --book: #2B4B7E; --book-tint: #E8EEF8; --note: #545A68; --note-tint: #EDEEF2;
  --ai: #8A5A00; --ai-tint: #FBF0DA; --focus: #2B4B7E;
  --shadow: 0 1px 2px rgba(31,26,27,.05), 0 4px 16px rgba(31,26,27,.05);
  --urdu: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Urdu Typesetting", "Noto Naskh Arabic", serif;
  --ui: "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
  --arabic: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #141112; --surface: #1D191A; --ink: #EFE9E8; --muted: #A99F9F; --rule: #342E2F;
    --matn: #F07B6F; --matn-tint: #3A1F1D; --teacher: #5CC7A2; --teacher-tint: #173229;
    --book: #93B2EA; --book-tint: #1C2638; --note: #A7ADBA; --note-tint: #262831;
    --ai: #E7B25B; --ai-tint: #34290F; --focus: #93B2EA; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #141112; --surface: #1D191A; --ink: #EFE9E8; --muted: #A99F9F; --rule: #342E2F;
  --matn: #F07B6F; --matn-tint: #3A1F1D; --teacher: #5CC7A2; --teacher-tint: #173229;
  --book: #93B2EA; --book-tint: #1C2638; --note: #A7ADBA; --note-tint: #262831;
  --ai: #E7B25B; --ai-tint: #34290F; --focus: #93B2EA; --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 15px; padding-inline: 16px; padding-block: 0 110px; }
.wrap { max-width: 760px; margin: 0 auto; }
[lang="ar"] { font-family: var(--arabic); }
button, input, a.btn { font: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.num { font-variant-numeric: tabular-nums; }

/* header */
header.top { padding-block: 14px 8px; display: grid; gap: 4px; }
.topbar { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.homelink { color: var(--book); font-size: 13.5px; font-weight: 600; text-decoration: none; padding-block: 6px; }
.homelink:hover { text-decoration: underline; }
.recbtn { margin-inline-start: auto; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule);
  background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 14px; font-size: 13.5px; font-weight: 600; }
.recbtn svg { width: 15px; height: 15px; fill: none; stroke: var(--teacher); stroke-width: 1.7; stroke-linecap: round; }
.recbtn:hover { border-color: var(--teacher); }
h1 { margin: 6px 0 0; font-family: var(--arabic); font-weight: 700; color: var(--matn); font-size: clamp(36px, 8vw, 50px); line-height: 1.25; }
.meta { color: var(--muted); font-size: 13.5px; line-height: 1.9; margin: 0; }
.meta b { color: var(--ink); font-weight: 600; }

/* contents (فہرست) */
.tochead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-block: 14px 4px; }
.tochead h2 { margin: 0; font-size: 15px; font-weight: 700; color: var(--muted); }
form.jump { display: flex; gap: 4px; margin-inline-start: auto; }
form.jump input { inline-size: 92px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 999px;
  padding: 5px 12px; font-size: 14px; font-variant-numeric: tabular-nums; direction: ltr; text-align: center; }
form.jump button { cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 999px; padding: 5px 13px; font-size: 13.5px; }
.msg { margin: 8px 0 0; color: var(--ink); background: var(--ai-tint); border-radius: 8px; padding: 7px 12px; font-size: 13.5px; line-height: 1.9; }
.msg a { color: var(--book); font-weight: 600; }
ol.toc { list-style: none; margin: 6px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.toc li { border-bottom: 1px solid var(--rule); padding-block: 10px 9px; display: grid; gap: 4px; }
.toc li.lv3 { padding-inline-start: 22px; }
.toc a.row { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: inherit; }
.toc .tt { font-family: var(--arabic); line-height: 1.6; }
.toc li.lv1 .tt { font-size: 23px; color: var(--matn); font-weight: 700; }
.toc li.lv2 .tt { font-size: 20px; font-weight: 700; }
.toc li.lv3 .tt { font-size: 18.5px; }
.toc .dots { flex: 1 1 24px; min-inline-size: 24px; border-bottom: 2px dotted var(--rule); transform: translateY(-5px); }
.toc .pp { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.toc a.row:hover .tt, .toc a.row:focus-visible .tt { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
.toc .sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.toc .sub .n { margin-inline-end: 4px; }
.toc .sub .none { color: var(--ai); }
.toc .sub .exn { color: var(--matn); font-weight: 600; margin-inline-end: 4px; }
a.pchip { text-decoration: none; color: var(--ink); border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 0 9px;
  font-size: 12.5px; line-height: 1.9; font-variant-numeric: tabular-nums; }
a.pchip:hover { border-color: var(--ink); }

/* unit view */
.ubar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); margin-inline: -16px; padding: 8px 16px 8px;
  border-bottom: 1px solid var(--rule); display: grid; gap: 6px; }
.ubar-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.back { flex: none; cursor: pointer; text-decoration: none; color: var(--book); font-size: 13.5px; font-weight: 600; border: 1px solid var(--rule); border-radius: 999px; padding: 3px 12px; background: var(--surface); }
.utitle { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--arabic); font-size: 19px; font-weight: 700; line-height: 1.6; }
.pbar { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.pbar::-webkit-scrollbar { display: none; }
.pbar a { flex: none; text-decoration: none; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 3px 13px; font-size: 14px; font-variant-numeric: tabular-nums; }
.pbar a[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ubar form.jump input { inline-size: 70px; padding: 3px 8px; }
.ubar form.jump button { padding: 3px 10px; }
.ubar form.jump { flex: none; }
body.unit h1 { font-size: 26px; margin-top: 0; }
body.unit header .meta { display: none; }
.uhead { padding-block: 16px 0; display: grid; gap: 2px; }
.uhead .parent { margin: 0; font-family: var(--arabic); color: var(--muted); font-size: 16px; }
.uhead h2 { margin: 0; font-family: var(--arabic); color: var(--matn); font-size: clamp(26px, 6vw, 32px); line-height: 1.5; }
.uhead p.meta { margin: 0; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; padding-block: 12px 0; color: var(--muted); font-size: 12.5px; align-items: center; }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.linkbtn { cursor: pointer; background: none; border: 0; color: var(--book); font-weight: 600; font-size: 13px; padding: 4px 0; margin-inline-start: auto; }

main { display: grid; gap: 18px; padding-block: 14px; }
article.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 18px 18px 14px; display: grid; gap: 12px; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.pg { font-size: 12.5px; font-weight: 600; color: var(--matn); background: var(--matn-tint); border-radius: 6px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.v7 { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.cnum { color: var(--muted); font-size: 12.5px; }
.badge { font-size: 12px; font-weight: 600; color: var(--book); background: var(--book-tint); border-radius: 999px; padding: 1px 9px; }
.badge.exam { color: var(--matn); background: var(--matn-tint); border: 0; font-family: inherit; line-height: inherit; }
button.badge.exam { cursor: pointer; }
.les { color: var(--muted); font-size: 12.5px; margin-inline-start: auto; }
.play { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--teacher); color: var(--teacher); background: transparent;
  border-radius: 999px; padding: 3px 11px; font-size: 13px; font-variant-numeric: tabular-nums; direction: ltr; }
.play svg { width: 10px; height: 10px; fill: currentColor; }
.norec-chip { margin-inline-start: auto; color: var(--ai); background: var(--ai-tint); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 600; }
.label { margin: 0; font-family: var(--arabic); color: var(--book); font-size: 15px; line-height: 1.7; }
h3.title { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.7; text-wrap: balance; }
.start { margin: 0; font-family: var(--arabic); font-size: 21px; line-height: 1.9; color: var(--matn); border-inline-start: 3px solid var(--matn); padding-inline-start: 12px; }
.ref { margin: -4px 0 0; color: var(--book); font-size: 13px; line-height: 1.9; }
.start-note { margin: -6px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.8; }
.norec { margin: 0; background: var(--ai-tint); color: var(--ink); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; line-height: 1.9; }
.norec b { color: var(--ai); }
.sec { display: grid; gap: 6px; }
.sec h4 { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.sec ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.sec li { font-family: var(--urdu); font-size: 16px; line-height: 2.35; }
.sec.tamheed li { font-size: 16.5px; }
.sec.masala li { font-weight: 600; }
.srcs { display: inline-flex; flex-wrap: wrap; gap: 4px; vertical-align: middle; margin-inline-start: 4px; }
.chip { font-family: var(--ui); font-size: 11.5px; line-height: 1.6; border-radius: 5px; padding: 0 6px; white-space: nowrap; font-variant-numeric: tabular-nums; border: 0; font-weight: 600; }
.chip.u { background: var(--teacher-tint); color: var(--teacher); cursor: pointer; }
.chip.k { background: var(--book-tint); color: var(--book); }
.chip.s { background: var(--note-tint); color: var(--note); }
.chip.a { background: var(--ai-tint); color: var(--ai); }
/* in the "سب" view a card opens folded: head, title, Arabic start and the note under it; the rest behind .ctoggle */
.ctoggle { display: none; cursor: pointer; align-items: center; gap: 6px 10px; inline-size: 100%; background: none; border: 0; border-top: 1px dashed var(--rule);
  padding: 8px 0 2px; color: var(--book); font-weight: 600; font-size: 13.5px; text-align: start; }
.ctoggle::before { content: "−"; display: inline-grid; place-items: center; inline-size: 18px; block-size: 18px; border-radius: 50%; border: 1px solid currentColor; font-size: 13px; line-height: 1; }
.ctoggle[aria-expanded="false"]::before { content: "+"; }
body.allview .ctoggle { display: flex; }
.cbody { display: grid; gap: 12px; }
article.card.folded .cbody { display: none; }
article.card { scroll-margin-top: 112px; }
.dlall { display: grid; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--teacher-tint); }
.dlall .btns { align-items: center; }
.dlall .sub { color: var(--muted); font-size: 12.5px; }
.dlall .dlstat { font-size: 12.5px; color: var(--ink); line-height: 1.9; }
.btn[disabled] { opacity: .55; cursor: default; }
details.more { border-top: 1px dashed var(--rule); padding-top: 8px; }
details.more > summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--book); font-weight: 600; font-size: 13.5px; padding-block: 2px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; display: inline-grid; place-items: center; inline-size: 18px; block-size: 18px; border-radius: 50%; border: 1px solid currentColor; font-size: 13px; line-height: 1; }
details.more[open] > summary::before { content: "−"; }
details.more > summary .hint { color: var(--muted); font-weight: 400; font-size: 12.5px; }
details.more > .inner { display: grid; gap: 12px; padding-top: 10px; }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 14px; }
.word { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding-block: 4px; border-bottom: 1px solid var(--rule); }
.word .ar { font-family: var(--arabic); font-size: 19px; color: var(--matn); }
.word .ur { font-family: var(--urdu); font-size: 14.5px; line-height: 2.2; flex: 1 1 auto; }
.word .chip { font-size: 10.5px; }

section.gaps { display: grid; gap: 8px; margin-block-start: 6px; border: 1px dashed var(--rule); border-radius: 12px; padding: 12px 14px; }
section.gaps h3 { margin: 0; font-size: 14.5px; }
section.gaps p.lead { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.9; }
.glist { margin: 0; padding: 0; list-style: none; display: grid; }
.glist li { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: start; padding-block: 8px; border-top: 1px solid var(--rule); }
.glist .gp { font-size: 12px; font-weight: 600; color: var(--ai); background: var(--ai-tint); border-radius: 6px; padding: 1px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.glist .gt { font-family: var(--urdu); font-size: 14.5px; line-height: 2.2; }
.glist .gv { grid-column: 2; color: var(--muted); font-size: 12px; }

nav.unav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-block-start: 18px; }
nav.unav a { display: grid; gap: 2px; text-decoration: none; color: inherit; border: 1px solid var(--rule); border-radius: 12px; padding: 10px 14px; background: var(--surface); }
nav.unav a:hover { border-color: var(--ink); }
nav.unav .k { color: var(--muted); font-size: 12px; }
nav.unav .t { font-family: var(--arabic); font-size: 17px; line-height: 1.6; }
nav.unav a.next { text-align: left; grid-column: 2; }

footer { margin-block-start: 28px; color: var(--muted); font-size: 13px; line-height: 2; border-top: 1px solid var(--rule); padding-block-start: 14px; }
footer p { margin: 0 0 6px; }

/* sheet */
.backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.38); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); color: var(--ink); inline-size: 100%; max-inline-size: 600px; max-block-size: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0;
  padding: 16px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; box-shadow: 0 -8px 30px rgba(0,0,0,.2); }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet h3 { margin: 0; font-size: 17px; line-height: 1.7; }
.sheet .x { margin-inline-start: auto; cursor: pointer; border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 999px; inline-size: 34px; block-size: 34px; font-size: 18px; line-height: 1; }
.sheet p { margin: 0; font-size: 13.5px; line-height: 1.95; color: var(--muted); }
.sheet p b { color: var(--ink); }
.rec { display: grid; gap: 6px; padding-block: 10px; border-top: 1px solid var(--rule); }
.rec-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.rec-top b { font-size: 14.5px; }
.rec-top .sub { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.state { font-size: 12px; font-weight: 600; border-radius: 5px; padding: 0 7px; }
.state.on { color: var(--teacher); background: var(--teacher-tint); }
.state.off { color: var(--muted); border: 1px solid var(--rule); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-decoration: none; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--teacher);
  background: var(--teacher); color: var(--surface); font-weight: 600; font-size: 13.5px; line-height: 1.6; }
.btn.ghost { background: transparent; color: var(--teacher); }
.btn svg { width: 12px; height: 12px; fill: currentColor; flex: none; }

/* player */
.player { position: fixed; inset-inline: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--rule); padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; justify-content: center; }
.player audio { flex: 1 1 280px; max-width: 520px; height: 36px; }
.speeds { display: flex; gap: 4px; direction: ltr; }
.speeds button, .pclose { cursor: pointer; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 3px 8px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.speeds button[aria-pressed="true"] { background: var(--teacher); color: var(--surface); border-color: var(--teacher); }
.now { font-size: 12.5px; color: var(--muted); }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--teacher); } to { box-shadow: var(--shadow); } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
@media (max-width: 460px) {
  article.card { padding: 14px 14px 10px; }
  .start { font-size: 19px; }
  .sec li { font-size: 15.5px; }
  .toc li.lv3 { padding-inline-start: 14px; }
}
</style>
</head>
<body>


<div class="wrap" dir="rtl" lang="ur">
  <header class="top">
    <div class="topbar">
      <a class="homelink" id="homeLink" href="./" hidden></a>
      <button type="button" class="recbtn" id="recBtn" aria-haspopup="dialog">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 10V8a5.5 5.5 0 0 1 11 0v2"/><path d="M2.5 10h2v4h-2zM11.5 10h2v4h-2z"/></svg><span>ریکارڈنگز</span>
      </button>
    </div>
    <h1 lang="ar" id="kitab"></h1>
    <p class="meta" id="meta"></p>
  </header>

  <section id="tocView">
    <div class="tochead">
      <h2>فہرست</h2>
      <form class="jump" data-jump role="search"><input inputmode="numeric" placeholder="صفحہ نمبر" aria-label="صفحہ نمبر"><button type="submit">کھولیں</button></form>
    </div>
    <p class="msg" id="tocMsg" hidden></p>
    <ol class="toc" id="toc"></ol>
  </section>

  <section id="unitView" hidden>
    <div class="ubar">
      <div class="ubar-top"><a class="back" href="#">فہرست</a><span class="utitle" lang="ar" id="ubarTitle"></span>
        <form class="jump" data-jump role="search"><input inputmode="numeric" placeholder="صفحہ" aria-label="صفحہ نمبر"><button type="submit">کھولیں</button></form></div>
      <nav class="pbar" id="pbar" aria-label="صفحات"></nav>
    </div>
    <div class="uhead">
      <p class="parent" lang="ar" id="uParent"></p>
      <h2 lang="ar" id="uTitle"></h2>
      <p class="meta" id="uMeta"></p>
    </div>
    <p class="msg" id="uMsg" hidden></p>
    <div class="legend" id="legend" aria-label="ماخذ کی علامتیں">
      <span class="lg" data-t="u"><span class="chip u">استاد</span><span>ریکارڈنگ کا وقت</span></span>
      <span class="lg" data-t="k"><span class="chip k">کتاب ص</span><span>متن</span></span>
      <span class="lg" data-t="s"><span class="chip s">شرح</span><span>حاشیہ یا بین السطور</span></span>
      <span class="lg" data-t="a"><span class="chip a">AI</span><span>خود جانچیں</span></span>
      <button type="button" class="linkbtn" id="toggleAll" aria-pressed="false">سب تفصیل کھولیں</button>
    </div>
    <main id="cards"></main>

t": "u", "v": "0:45:49"}]}, {"x": "مثال: میں نے کسی کو قرضہ دیا اور اس نے اپنا گھر میرے پاس رہن رکھوایا؛ گھر میرے پاس ہے مگر میں مالک نہیں (مرتہن ہوں)؛ دیوار گرنے لگے تو میں اسے ہٹا نہیں سکتا، تو مجھ سے مطالبہ بھی نہیں۔", "s": [{"t": "u", "v": "0:45:54"}, {"t": "u", "v": "0:46:06"}]}], "masala": [{"x": "مرتہن، کرایہ دار، جس کے پاس گھر امانت رکھوایا (مودَع)، اور جو ویسے گھر میں رہ رہا ہو: ان سے مطالبہ نہیں ہو سکتا، کیونکہ انہیں ہٹانے کا اختیار نہیں۔ (کتاب: «ومن لا يتمكن منه لا يصح التقدم إليه كالمرتهن والمستأجر والمودع وساكن الدار»؛ حاشیہ: کرایہ یا عاریت پر رہنے والے سے مطالبہ کیا اور دیوار گر گئی تو کسی پر ضمان نہیں: سکان سے مطالبہ صحیح نہیں تھا، مالک سے ہوا نہیں۔)", "s": [{"t": "u", "v": "0:46:06"}, {"t": "k", "v": "1888", "v7": 1136}, {"t": "s", "v": "الكفاية ٢٥٣/٩"}]}, {"x": "راہن (گھر کا مالک) سے مطالبہ ہو سکتا ہے، کیونکہ وہ قرضہ دے کر گھر چھڑوا سکتا اور دیوار ٹھیک کر سکتا ہے۔ (کتاب: «ويصح التقدم إلى الراهن؛ لقدرته على ذلك بواسطة الفكاك»۔)", "s": [{"t": "u", "v": "0:46:23"}, {"t": "k", "v": "1888", "v7": 1136}]}, {"x": "بچے کی زمین کی دیوار میں وصی، یتیم کے دادا اور بچے کی ماں سے مطالبہ ہو سکتا ہے، کیونکہ انہیں ولایت ہے؛ انہوں نے نہ ہٹائی اور گر گئی تو ضمان یتیم کے مال میں، کیونکہ یہ بچے کی طرف سے نیابتاً کام کرتے ہیں، دیوار بچے کی ہے تو نقصان بھی بچہ دے گا۔ (کتاب: «وإلى الوصي وإلى أب اليتيم، أو أمه في حائط الصبي؛ لقيام الولاية، وذكر الإمام في الزيادات: والضمان في مال اليتيم؛ لأن فعل هؤلاء كفعله»؛ حاشیہ: «أب اليتيم» سے مراد دادا، کیونکہ یتیم کا باپ نہیں ہوتا اور باپ نہ ہو تو دادا کو باپ کہتے ہیں۔)", "s": [{"t": "u", "v": "0:46:23"}, {"t": "u", "v": "0:47:02"}, {"t": "u", "v": "0:47:07"}, {"t": "u", "v": "0:47:12"}, {"t": "k", "v": "1888", "v7": 1136}, {"t": "s", "v": "البناية ٢٥١/١٣"}]}, {"x": "مکاتب سے مطالبہ ہو سکتا ہے، کیونکہ ولایت اسی کی ہے۔ (کتاب: «وإلى المكاتب؛ لأن الولاية له»۔)", "s": [{"t": "u", "v": "0:47:36"}, {"t": "k", "v": "1888", "v7": 1136}]}, {"x": "جس غلام کو آقا نے تجارت کی اجازت دی ہو اس سے بھی مطالبہ (اس پر قرض ہو یا نہ ہو)؛ اس نے نہ ہٹائی اور گر کر مال (مثلاً گاڑی) تباہ ہوا تو اس کا تعلق غلام کی ذات (گردن) سے ہے؛ بندہ مرا تو دیت مولیٰ کی عاقلہ پر۔ (کتاب: «وإلى العبد التاجر، سواء كان عليه دين أو لم يكن؛ لأن ولاية النقض له، ثم التالف بالسقوط إن كان مالاً فهو في عنق العبد، وإن كان نفساً فهو على عاقلة المولى»؛ حاشیہ: غلام اس میں بیچا جائے گا جیسے تجارت کے قرضوں میں بیچا جاتا ہے۔)", "s": [{"t": "u", "v": "0:47:42"}, {"t": "u", "v": "0:47:52"}, {"t": "u", "v": "0:48:05"}, {"t": "k", "v": "1888", "v7": 1136}, {"t": "k", "v": "1888", "v7": 1137}, {"t": "s", "v": "الكفاية ٢٥٥/٩"}]}, {"x": "ورثاء: کوئی مر گیا اور چار بچوں کا مشترک گھر ہے؛ کسی ایک وارث سے مطالبہ کافی، اگرچہ وہ اکیلا نہیں گرا سکتا؛ وہ باقی ورثاء سے کہہ سکتا ہے، نہ مانیں تو قاضی کے پاس جا سکتا ہے؛ مطالبے کے باوجود نہ ہٹایا تو ضامن۔ کتاب: یہ مطالبہ «اس کے حصے میں» صحیح ہے۔ (کتاب: «ويصح التقدم إلى أحد الورثة في نصيبه، وإن كان لا يتمكن من نقض الحائط وحده؛ لتمكنه من إصلاح نصيبه بطريقه، وهو المرافعة إلى القاضي»؛ حاشیہ: ہلاکت ہو تو وہ ایک وارث اپنے حصے کے بقدر ضامن۔)", "s": [{"t": "u", "v": "0:48:46"}, {"t": "u", "v": "0:49:08"}, {"t": "u", "v": "0:49:13"}, {"t": "k", "v": "1888", "v7": 1137}, {"t": "s", "v": "العناية ٢٥٥/٩"}]}], "dalil": [{"x": "تجارت والے غلام میں فرق کی وجہ (کتاب): اشہاد ایک لحاظ سے مولیٰ پر ہے، اور مال کا ضمان غلام کے لائق ہے، جان کا ضمان مولیٰ کے۔ (کتاب: «لأن الإشهاد من وجه على المولى، وضمان المال أليق بالعبد، وضمان النفس بالمولى»؛ حاشیہ: تجارت کی اجازت مال میں غلام کو آزاد کی طرح کر دیتی ہے، مگر جان کی جنایت کا بوجھ اٹھانے کو شامل نہیں۔) استاد کی وجہ: دیت کا تعلق عاقلہ سے ہے اور غلام کی کوئی عاقلہ نہیں، تو آقا کی عاقلہ۔", "s": [{"t": "u", "v": "0:48:05"}, {"t": "k", "v": "1888", "v7": 1137}, {"t": "s", "v": "الكفاية ٢٥٥/٩"}, {"t": "s", "v": "العناية ٢٥٥/٩"}]}], "ikhtilaf": [], "faida": [{"x": "استاد: «اب اس سے آپ مثالیں ذہن میں رکھیں» (مرتہن، کرایہ دار، مودَع، رہنے والا بمقابلہ راہن، وصی، دادا، ماں)۔", "s": [{"t": "u", "v": "0:45:54"}]}, {"x": "حاشیہ (المبسوط): باپ یا وصی سے مطالبہ کیا اور گر گئی تو ضمان بچے پر، کیونکہ یہ اس کے قائ , "tamheed": [{"x": "باب کے شروع میں کہا تھا: «جنایۃ البہیمۃ والجنایۃ علیہا»، جانور کسی کا نقصان کرے، یا جانور کا نقصان کیا جائے (آنکھ پھوڑی جائے، ہاتھ توڑا جائے)؛ پہلی صورت گزر گئی؛ دوسری میں سارے مسائل نہیں، ایک آدھ مسئلہ ذکر کیا ہے۔", "s": [{"t": "u", "v": "0:41:07"}]}, {"x": "بکری یا بکرے میں ایک ہی فائدہ ہے کہ آدمی اس کا گوشت استعمال کرتا ہے؛ آنکھ خراب ہو یا پھوڑ دی جائے تو کوئی فرق نہیں، گوشت اب بھی وہی ہے۔", "s": [{"t": "u", "v": "0:41:46"}]}], "masala": [{"x": "کسی نے دوسرے کی بکری کی آنکھ پھوڑ دی تو قیمت میں جتنا فرق آیا اتنا دے گا: صحیح حالت میں قیمت 50 ہزار تھی، اب 40 ہزار، تو 10 ہزار۔ (کتاب: «شاة لقصاب فقئت عينها، ففيها ما نقصها؛ لأن المقصود منها هو اللحم، فلا يعتبر إلا النقصان»؛ حاشیہ: یعنی بکری کی قیمت میں جو کمی آئی۔)", "s": [{"t": "u", "v": "0:42:09"}, {"t": "u", "v": "0:44:43"}, {"t": "k", "v": "1895", "v7": 1154}, {"t": "s", "v": "البناية"}]}, {"x": "گائے، بیل یا اونٹ، یا گھوڑے، گدھے، خچر کی آنکھ پھوڑ دی تو نقصان نہیں بلکہ پوری قیمت کا ایک چوتھائی دینا ہوگا۔ (کتاب: «وفي عين بقرة الجزار وجزوره ربع القيمة، وكذا في عين الحمار والبغل والفرس»؛ حاشیہ: گدھے کی آنکھ میں بھی چوتھائی قیمت۔)", "s": [{"t": "u", "v": "0:42:32"}, {"t": "u", "v": "0:44:43"}, {"t": "k", "v": "1895", "v7": 1154}, {"t": "s", "v": "البناية 13/ 269"}]}], "dalil": [{"x": "(۱) حدیث: حضور ﷺ نے اس طرح کے جانور کی آنکھ میں ایک چوتھائی قیمت کا فیصلہ کیا؛ (۲) حضرت عمر کا بھی یہی فیصلہ ہے۔ (کتاب: «ولنا ما روي أنه عليه السلام قضى في عين الدابة بربع القيمة، وهكذا قضى عمر»۔)", "s": [{"t": "u", "v": "0:42:56"}, {"t": "k", "v": "1895", "v7": 1154}]}, {"x": "(۳) بڑے جانوروں میں صرف گوشت نہیں: لوگ سواری کرتے ہیں، باربرداری کرتے ہیں، ان میں خوبصورتی ہے (استاد: قرآن میں بھی کہا گیا کہ تمہارے لیے زینت کا سامان ہے)، تو اس لحاظ سے انسان کی طرح؛ اور کبھی گوشت بھی کھایا جاتا ہے تو ماکولات (بکری وغیرہ) کی طرح؛ دونوں مشابہتوں پر عمل: انسان (یا غلام) کی آنکھ میں آدھی دیت یا آدھی قیمت ہوتی، یہاں انسان سے کم، ایک چوتھائی۔ (کتاب: «ولأن فيها مقاصد سوى اللحم كالحمل والركوب والزينة والجمال والعمل، فمن هذا الوجه تشب انا کہ وہ فوراً کوئی ری ایکشن کرے؛ اس کی دو صورتیں ہیں: جانور کے مالک کی اجازت سے کوئی اسے چھیڑے، یا اس کی اجازت کے بغیر۔", "s": [{"t": "u", "v": "0:00:39"}, {"t": "u", "v": "0:00:46"}, {"t": "u", "v": "0:00:53"}, {"t": "u", "v": "0:00:59"}, {"t": "u", "v": "0:01:04"}]}, {"x": "بغیر اجازت کسی نے از خود جانور کو نیزہ مارا یا اس پر آواز کی، جس سے جانور نے کسی کو لات ماری، اگلا ہاتھ مارا، یا بدک کر کسی پر چڑھ دوڑا اور اسے قتل کر دیا؛ اوپر سوار بھی تھا، لیکن یہ سارا قصور چھیڑنے والے کا ہے۔", "s": [{"t": "u", "v": "0:01:09"}, {"t": "u", "v": "0:01:17"}, {"t": "u", "v": "0:01:24"}, {"t": "u", "v": "0:01:29"}, {"t": "u", "v": "0:01:31"}, {"t": "u", "v": "0:01:33"}]}], "masala": [{"x": "ضمان ناخس پر، سوار پر نہیں؛ جانور کے فعل کی نسبت چھیڑنے والے کی طرف ہوگی، گویا اس نے خود یہ کام کیا۔ (کتاب: «ومن سار على دابة في الطريق، فضربها رجل أو نخسها، فنفحت رجلا، أو ضربته بيدها، أو نفرت فصدمته فقتلته: كان ذلك على الناخس دون الراكب»؛ کتاب: یہی حضرت عمر اور ابن مسعود سے مروی ہے۔)", "s": [{"t": "u", "v": "0:01:33"}, {"t": "u", "v": "0:01:52"}, {"t": "u", "v": "0:04:21"}, {"t": "u", "v": "0:04:23"}, {"t": "u", "v": "0:04:25"}, {"t": "u", "v": "0:04:28"}, {"t": "u", "v": "0:04:31"}, {"t": "u", "v": "0:04:34"}, {"t": "u", "v": "0:04:37"}, {"t": "u", "v": "0:04:39"}, {"t": "k", "v": "1896", "v7": 1155}]}, {"x": "اگر سوار نے جانور کو بالکل راستے میں کھڑا کیا تھا تو دونوں کا قصور ہے (ناخس کا چھیڑنا، سوار کا راستے میں کھڑا کرنا)، تو نقصان آدھا آدھا۔ (کتاب: «حتى لو كان واقفا دابته على الطريق يكون الضمان على الراكب والناخس نصفين؛ لأنه متعد في الإيقاف أيضا»۔)", "s": [{"t": "u", "v": "0:02:48"}, {"t": "u", "v": "0:02:52"}, {"t": "u", "v": "0:02:56"}, {"t": "k", "v": "1896", "v7": 1156}]}, {"x": "جانور نے الٹا چھیڑنے والے ہی کو لات ماری اور وہ مر گیا تو اس کا خون ہدر، کیونکہ اس نے گویا خودکشی کی۔ (کتاب: «وإن نفحت الناخس: كان دمه هدرا؛ لأنه بمنزلة الجاني على نفسه»۔)", "s": [{"t": "u", "v": "0:03:20"}, {"t": "u", "v": "0:03:25"}, {"t": "u", "v": "0:04:50"}, {"t": "u", "v": "0:04:55"}, {"t": "u", "v": "}, {"t": "u", "v": "0:04:01"}, {"t": "u", "v": "0:04:20"}, {"t": "k", "v": "1901–1902", "v7": 1169}, {"t": "s", "v": "بشریٰ ٨ جلدی، بین السطور"}, {"t": "s", "v": "البناية"}]}, {"x": "دوسری دلیل: آقا نے اسے زید کو مارنے پر ابھارا؛ غلام تو اب زید کو مارنا ہی چاہے گا تاکہ آزاد ہو جائے؛ یہ علامت ہے کہ وہ مارنے کی صورت میں فدیہ دینا چاہتا ہے۔ (کتاب: «ولأنه حرّضه على مباشرة الشرط بتعليق أقوى الدواعي إليه، والظاهر أنه يفعله، فهذا دلالة الاختيار»؛ حاشیہ: «أقوى الدواعي» = آزادی کی رغبت؛ بین السطور: «أقوى الدواعي» = وهو الحرية، «الاختيار» = اختيار الفداء۔)", "s": [{"t": "u", "v": "0:05:05"}, {"t": "u", "v": "0:05:11"}, {"t": "k", "v": "1902", "v7": 1170}, {"t": "s", "v": "العناية ٢٧٧/٩"}, {"t": "s", "v": "بشریٰ ٨ جلدی، بین السطور"}]}], "ikhtilaf": [{"x": "امام زفر: آقا فدیہ اختیار کرنے والا نہیں؛ جب اس نے یہ بات کہی تو اسے پتہ ہی نہیں تھا کہ وہ جنایت کرے گا یا نہیں، اور جنایت کے بعد اس سے کوئی ایسا کام نہیں ہوا جس سے فدیہ اختیار کرنا سمجھا جائے؛ تو عام احکام کے مطابق معاملہ ہوگا (حاشیہ: اس پر غلام کی قیمت)۔ (کتاب: «وقال زفر: لا يصير مختاراً للفداء؛ لأن وقت تكلمه لا جناية، ولا علم له بوجوده، وبعد الجناية لم يوجد منه فعل يصير به مختاراً»۔)", "s": [{"t": "u", "v": "0:02:17"}, {"t": "u", "v": "0:02:26"}, {"t": "u", "v": "0:02:28"}, {"t": "u", "v": "0:02:57"}, {"t": "u", "v": "0:03:11"}, {"t": "k", "v": "1901–1902", "v7": 1169}, {"t": "s", "v": "الكفاية ٢٧٧/٩"}]}, {"x": "امام زفر کی نظیر: آدمی نے بیوی سے کہا: اگر تم گھر میں داخل ہوئی تو تمہیں طلاق، پھر قسم کھائی کہ کبھی طلاق نہیں دے گا؛ پھر بیوی داخل ہوئی اور طلاق واقع ہو گئی تو وہ حانث نہیں ہوگا۔ (کتاب: «ألا ترى أنه لو علّق الطلاق أو العتاق بالشرط، ثم حلف أن لا يطلق أو لا يعتق، ثم وجد الشرط، وثبت العتق والطلاق: لا يحنث في يمينه تلك، كذا هذا»؛ حاشیہ: کیونکہ قسم کے خلاف کوئی فعل نہیں پایا گیا۔)", "s": [{"t": "u", "v": "0:02:41"}, {"t": "u", "v": "0:02:46"}, {"t": "u", "v": "0:02:50"}, {"t": "k", "v": "1901–1902", "v7": 1169}]}, {"x": "اس نظیر کا جواب: قسم اس لیے ہوتی ہے کہ آدمی کسی ایسے کام سے رک جائے جس سے وہ رک سکتا ہو؛ جس سے رک u", "v": "0:07:21"}, {"t": "u", "v": "0:08:09"}, {"t": "u", "v": "0:16:36"}, {"t": "k", "v": "1902–1903", "v7": 1170}, {"t": "s", "v": "بشریٰ ٨ جلدی، بین السطور"}]}, {"x": "آزاد نہیں کیا تھا، غلام ابھی اس کے پاس تھا اور وہ مر گیا تو غلام آقا کو واپس دیا جائے گا، اور مقتول کے ورثاء سے کہا جائے گا: اس غلام نے جان بوجھ کر قتل کیا ہے، چاہو تو قصاص میں قتل کرو، چاہو تو معاف کر دو۔ (کتاب: «وإن لم يعتقه: ردّ على المولى، وقيل للأولياء: اقتلوه، أو اعفوا عنه»۔)", "s": [{"t": "u", "v": "0:07:30"}, {"t": "u", "v": "0:07:32"}, {"t": "u", "v": "0:07:40"}, {"t": "u", "v": "0:07:53"}, {"t": "u", "v": "0:08:09"}, {"t": "u", "v": "0:17:08"}, {"t": "u", "v": "0:17:14"}, {"t": "k", "v": "1902–1903", "v7": 1170}]}], "dalil": [{"x": "آزاد نہ کرنے کی صورت: ہاتھ کاٹنے کے بدلے جو صلح کیا اور غلام لیا وہ صلح باطل ہے؛ کیونکہ صلح اعضاء کے بدلے مال پر تھا (آزاد اور غلام کے اعضاء میں قصاص نہیں چلتا)؛ جب بندہ مر گیا تو پتہ چلا کہ یہاں مال تھا ہی نہیں، اب تو قصاص واجب ہے؛ تو صلح بغیر بدل کے رہ گیا اور باطل ہو گیا۔ (کتاب: «ووجه ذلك، وهو: أنه إذا لم يعتقه وسرى تبين أن الصلح وقع باطلاً؛ لأن الصلح كان عن المال؛ لأن أطراف العبد لا يجري القصاص بينها وبين أطراف الحر، فإذا سرى تبين أن المال غير واجب، وإنما الواجب هو القود، فكان الصلح واقعاً بغير بدل فبطل»؛ حاشیہ: یہاں «صلح» سے مراد غلام دینا ہے، اسے صلح ان بعض مشائخ کی رائے پر کہا جن کے ہاں اصل واجب فدیہ ہے۔)", "s": [{"t": "u", "v": "0:08:25"}, {"t": "u", "v": "0:08:31"}, {"t": "u", "v": "0:08:44"}, {"t": "u", "v": "0:09:01"}, {"t": "u", "v": "0:09:05"}, {"t": "k", "v": "1902–1903", "v7": 1170}, {"t": "s", "v": "العناية ٢٧٨/٩"}]}, {"x": "قصاص ویسے شبہ سے ساقط ہو جاتا ہے، مگر یہ باطل صلح شبہ پیدا نہیں کرتا؛ جیسے کسی نے بیوی کو تین طلاقیں دیں، پھر عدت میں اس سے دخول کیا اور قاضی کے پوچھنے پر کہا: ہاں مجھے پتہ تھا کہ حرام ہے، تو قاضی اس پر حد جاری کرے گا۔ (کتاب: «والباطل لا يورث الشبهة كما إذا وطئ المطلقة الثلاث في عدتها مع العلم بحرمتها عليه، فوجب القصاص»؛ حاشیہ: وہ حد ٹالنے کا شبہ نہیں بنتا۔)", "s": [{"t": "u", "v": "0:09:20"}, {"t": "u", "v": "0:09:30"}, 2 ساتویں سطر «فالتخريج ما ذكرناه من قبل» تک؛ کارڈ «قال: وإذا جنى العبد المأذون» (≈0.86) سے پہلے ختم۔", "norec": "", "badges": null, "exam": null, "v7": "بشریٰ ج٨ ص 171–172", "tamheed": [{"x": "ایک آزاد آدمی نے دوسرے کا ہاتھ جان بوجھ کر کاٹ دیا؛ جس کا ہاتھ کٹا اس نے کاٹنے والے سے صلح کیا کہ تم مجھے غلام دے دو، اس نے غلام دے دیا۔", "s": [{"t": "u", "v": "0:11:05"}, {"t": "u", "v": "0:11:22"}, {"t": "u", "v": "0:11:24"}, {"t": "u", "v": "0:11:30"}]}, {"x": "ایک اور صورت: کسی نے دوسرے کا ہاتھ کاٹا اور اس نے اسے ویسے ہی (مفت) معاف کر دیا؛ معافی کے بعد وہ ہاتھ کٹنے سے مر گیا تو اس صورت میں قصاص واجب نہیں ہوتا۔", "s": [{"t": "u", "v": "0:12:08"}, {"t": "u", "v": "0:12:18"}, {"t": "u", "v": "0:12:21"}]}], "masala": [{"x": "غلام لینے کے بعد اس نے غلام آزاد کیا اور پھر ہاتھ کٹنے سے مر گیا تو صلح ہو گیا، اب قصاص نہیں، اسے مزید کچھ نہیں ملے گا اور غلام آزاد ہو گیا۔ (کتاب: «فأعتقه المقطوعة يده، ثم مات من ذلك: قال: العبد صلح بالجناية إلى آخر ما ذكرنا من الرواية»؛ حاشیہ: یعنی آزاد نہ کیا تو غلام واپس اور اولیاء کو قتل اور معافی کا اختیار۔)", "s": [{"t": "u", "v": "0:11:37"}, {"t": "u", "v": "0:11:41"}, {"t": "u", "v": "0:11:42"}, {"t": "u", "v": "0:11:53"}, {"t": "u", "v": "0:11:55"}, {"t": "k", "v": "1903", "v7": 1171}, {"t": "s", "v": "العناية ٢٧٩/٩"}]}, {"x": "اشکال: غلام والی صورت میں آزاد نہ کیا تو آپ کہتے ہیں غلام واپس اور قصاص؛ تو معافی والی صورت میں یہ کیوں نہیں کہتے کہ اس نے ہاتھ کاٹنے سے معاف کیا تھا، مارنے سے نہیں، اب مر گیا تو قصاص لیا جائے؟ (کتاب: «وهذا الوضع يرد إشكالاً فيما إذا عفا عن اليد ثم سرى إلى النفس ومات حيث لا يجب القصاص هنالك، وههنا قال: يجب»؛ حاشیہ: «ههنا قال يجب» = «وقيل للأولياء: اقتلوه»۔)", "s": [{"t": "u", "v": "0:12:24"}, {"t": "u", "v": "0:12:47"}, {"t": "u", "v": "0:12:58"}, {"t": "k", "v": "1903", "v7": 1171}, {"t": "k", "v": "1903", "v7": 1172}, {"t": "s", "v": "الكفاية"}]}], "dalil": [{"x": "پہلا جواب (کتاب: «قيل»؛ حاشیہ: مشائخ کا اختلاف): دونوں مسئلوں میں قیاس کا تقاضا ہے کہ قصاص واجب ہو اور استحسان کا تقاضا ہے کہ واجب نہ ہو؛ یہاں جو قصاص ذکر ہو amheed": [{"x": "باندی کو آقا نے تجارت کی اجازت دی اور اس نے قرض لیا؛ قرض غلام (باندی) کی قیمت سے لیا جاتا ہے، اسے بیچ کر قرض دلوایا جاتا ہے۔", "s": [{"t": "u", "v": "0:22:38"}, {"t": "u", "v": "0:22:54"}]}, {"x": "باندی کی قیمت ایک ہزار درہم، قرض لیا بارہ سو درہم؛ اب اس کا بچہ پیدا ہوا جس کی قیمت دو سو ہے؛ بچہ بھی غلام ہے۔", "s": [{"t": "u", "v": "0:23:07"}, {"t": "u", "v": "0:23:18"}]}, {"x": "دوسری صورت: باندی کی قیمت ہزار درہم اور اس نے بارہ سو کی جنایت کر لی۔", "s": [{"t": "u", "v": "0:23:27"}, {"t": "u", "v": "0:23:32"}]}], "masala": [{"x": "قرض والی صورت میں بچہ بھی قرض میں دیا جائے گا: دونوں کو (ہزار اور دو سو) بیچ کر بارہ سو کا قرض دے دیا جائے گا۔ (کتاب: «وإذا استدانت الأمة المأذون لها أكثر من قيمتها، ثم ولدت: فإنه يباع الولد معها في الدين»؛ حاشیہ: یہ تب جب قرض لینے کے بعد بچہ جنا؛ قرض سے پہلے جنا تو قرض خواہوں کا حق اس سے متعلق نہیں۔)", "s": [{"t": "u", "v": "0:23:18"}, {"t": "u", "v": "0:25:18"}, {"t": "u", "v": "0:25:22"}, {"t": "k", "v": "1904", "v7": 1174}, {"t": "s", "v": "الكفاية ٢٨٠/٩-٢٨٠"}]}, {"x": "جنایت والی صورت میں باندی بچے سمیت نہیں بیچی جائے گی اور نہ آقا سے بچہ دینے کو کہا جائے گا؛ صرف باندی (اولیائے جنایت کو) دی جائے گی، اب رکھیں یا بیچیں ان کی مرضی۔ (کتاب: «وإن جنت جناية: لم يدفع الولد معها»۔)", "s": [{"t": "u", "v": "0:23:37"}, {"t": "u", "v": "0:25:40"}, {"t": "k", "v": "1904", "v7": 1174}]}], "dalil": [{"x": "فرق: قرض ایک حکمی (شرعی) وصف ہے جس کا تعلق ذمے سے ہے، کوئی محسوس چیز نہیں (قرض ہو یا نہ ہو، باندی کی شکل اور وزن ایک ہی)؛ اسے باندی کے رقبے سے وصول کیا جاتا ہے؛ ایسے حکمی اوصاف ماں سے بچے کی طرف منتقل ہوتے ہیں، جیسے ماں رہن میں ہو تو بچہ بھی رہن میں۔ (کتاب: «والفرق: أن الدين وصف حكمي فيها واجب في ذمتها متعلق برقبتها استيفاءً، فيسري إلى الولد كولد المرهونة»؛ حاشیہ: رقبے سے متعلق ہونے کی وجہ سے آقا اسے بیچنے یا ہبہ کرنے سے روک دیا جاتا ہے۔)", "s": [{"t": "u", "v": "0:23:52"}, {"t": "k", "v": "1904", "v7": 1174}, {"t": "s", "v": "العناية ٢٨٠/٩"}, {"t": "s", "v": "البناية"}]}, {"x": "جنایت میں دینا آقا کے ذمے ہے، باندی کے ذمے نہیں؛ اس "}]}]}, {"unit": "u8", "pages": [1904], "lesson": "2025-11-04", "ts": "0:25:45", "label": null, "title": "غلام ایک آدمی کا تھا، دوسرے نے دعویٰ کیا کہ اس کے آقا نے اسے آزاد کر دیا ہے، پھر غلام نے اس دعویٰ کرنے والے کے ولی (مثلاً بیٹے) کو خطأً قتل کر دیا تو اسے کچھ نہیں ملے گا: اس نے عاقلہ پر دیت کا دعویٰ کیا اور غلام اور آقا کو بری کر دیا، اور عاقلہ پر اس کی بات بغیر حجت کے نہیں مانی جائے گی", "start": "قال: وإذا كان العبدُ لرجل زعم رجل آخر أن مولاه أعتقه", "start_note": "بشریٰ ج٨ ص 174 چھٹی سطر (≈0.9) سے ص 175 (PDF 176، فائل p0176-0180.md کا پہلا حصہ) تیسری سطر «إلا أنه لا يصدق على العاقلة من غير حجة» تک؛ حاشیہ: «قال» = امام محمد، الجامع الصغير۔ 0:25:45 پوری عبارت پڑھی، 0:26:02–0:28:24 سمجھایا، 0:28:25–0:28:32 دوبارہ پڑھی؛ دلیل کی عربی نہیں پڑھی۔ کارڈ «قال: وإذا أعتق العبد» (≈0.2) سے پہلے ختم۔", "norec": "", "badges": null, "exam": null, "v7": "بشریٰ ج٨ ص 174–175", "tamheed": [{"x": "کسی آدمی کا غلام ہے، سب کو پتہ ہے کہ یہ اس کا غلام ہے؛ زید نے کہا: نہیں، یہ غلام نہیں، اس کے آقا نے اسے آزاد کر دیا ہے؛ بات چلی گئی۔", "s": [{"t": "u", "v": "0:26:02"}, {"t": "u", "v": "0:26:03"}, {"t": "u", "v": "0:26:07"}, {"t": "u", "v": "0:26:12"}]}, {"x": "اب اس غلام نے زید کے بیٹے کو غلطی سے قتل کر دیا (جان بوجھ کر کرتا تو زید اس سے قصاص لیتا)۔", "s": [{"t": "u", "v": "0:26:12"}, {"t": "u", "v": "0:26:24"}]}], "masala": [{"x": "غلطی سے قتل کیا تو زید کو کچھ بھی نہیں ملے گا۔ (کتاب: «وإذا كان العبد لرجل زعم رجل آخر أن مولاه أعتقه، فقتل العبد وليّاً لذلك الرجل خطأً: فلا شيء له»۔)", "s": [{"t": "u", "v": "0:25:45"}, {"t": "u", "v": "0:26:24"}, {"t": "u", "v": "0:28:25"}, {"t": "u", "v": "0:28:32"}, {"t": "k", "v": "1904", "v7": 1174}, {"t": "k", "v": "1904", "v7": 1175}]}], "dalil": [{"x": "اگر یہ غلام ہوتا تو آقا پر لازم تھا کہ غلام دے یا ارش دے (دفع یا فدیہ)؛ مگر زید نے خود کہا تھا کہ آقا نے اسے آزاد کیا ہے؛ تو وہ غلام کی قیمت سے نہیں، غلام کی عاقلہ پر دیت کا دعویٰ کرتا ہے؛ اس طرح اس نے غلام کو بھی بری کیا (قتلِ خطا میں دیت قاتل سے نہیں، عاقلہ سے لی جاتی ہے) اور مولیٰ کو بھی (کیونکہ 8:44"}, {"t": "u", "v": "0:08:58"}, {"t": "u", "v": "0:09:07"}, {"t": "u", "v": "0:10:22"}, {"t": "k", "v": "1905", "v7": 1177}, {"t": "k", "v": "1905–1906", "v7": 1178}]}, {"x": "حکم دینے والا بھی بچہ ہو تو بھی قاتل بچے کی عاقلہ دیت دے گی، حکم دینے والے بچے پر کچھ نہیں اور اس سے کبھی کچھ نہیں لیا جا سکتا۔ (کتاب: «وكذا إذا كان الآمر صبياً … ولا رجوع لعاقلة الصبي على الصبي الآمر أبداً»۔)", "s": [{"t": "u", "v": "0:09:11"}, {"t": "u", "v": "0:09:35"}, {"t": "u", "v": "0:10:15"}, {"t": "k", "v": "1905–1906", "v7": 1178}]}, {"x": "غلام آمر: جب تک غلام ہے مولیٰ کے حق کی وجہ سے اس سے کچھ نہیں لیا جا سکتا؛ آزاد ہو گیا تو بچے کی عاقلہ اس سے رجوع کریں گے۔ (کتاب: «ويرجعون على العبد الآمر بعد الإعتاق»۔)", "s": [{"t": "u", "v": "0:09:49"}, {"t": "u", "v": "0:09:55"}, {"t": "u", "v": "0:10:07"}, {"t": "u", "v": "0:10:22"}, {"t": "k", "v": "1905–1906", "v7": 1178}]}, {"x": "محجور غلام نے دوسرے محجور غلام کو قتل کا حکم دیا: پہلے پر (فی الحال) کچھ نہیں، قاتل دوسرا ہے؛ دوسرے کے مولیٰ سے کہا جائے گا: غلام دے دو یا دیت (فدیہ) دے دو؛ اس نے دے دیا تو وہ فی الحال پہلے غلام سے رجوع نہیں کر سکتا (غلام سے لیا نہیں جا سکتا اور اس کے آقا کا قصور نہیں)، آزادی کے بعد کر سکتا ہے۔ (کتاب: «وكذلك إن أمر عبداً، معناه: أن يكون الآمر عبداً، والمأمور عبداً محجوراً عليهما، يُخاطب مولى القاتل بالدفع أو الفداء، ولا رجوع له على الأول في الحال، ويجب أن يرجع بعد العتق»۔)", "s": [{"t": "u", "v": "0:10:44"}, {"t": "u", "v": "0:10:58"}, {"t": "u", "v": "0:11:06"}, {"t": "u", "v": "0:11:13"}, {"t": "u", "v": "0:11:23"}, {"t": "u", "v": "0:11:33"}, {"t": "u", "v": "0:12:41"}, {"t": "k", "v": "1905–1906", "v7": 1178}]}, {"x": "کتنا رجوع کرے گا؟ فدیہ (جنایت کا تاوان) اور غلام کی قیمت میں جو کم ہو؛ آقا نے زیادہ دیا تو اس کی مرضی تھی۔ (کتاب: «بأقلّ من الفداء وقيمة العبد؛ لأنه غير مضطر في دفع الزيادة»؛ حاشیہ: وہ کم دے کر بری ہو سکتا تھا، کیونکہ اس کے حکم سے جو ضائع ہوا وہ ان دونوں میں کم ہی ہے۔)", "s": [{"t": "u", "v": "0:11:41"}, {"t": "u", "v": "0:11:55"}, {"t": "k", "v": "1905–1906", "v7": 1178}, {"t": "s", "v": "العناية ٢٨٣/٩"}, {"t": "s", "v": "شرح الوقاية"}]}, {"x": "یہ تفصیل تب ہے جب قتل خطا ہو، یا قاتل غلام نابالغ ہو، کیونکہ اس کا عمد خطا ہے؛ اگر قاتل بڑا غلام ہو اور جان بوجھ کر قتل کیا تو اس سے قصاص لیا جائے گا، دیت کی بات نہیں آئے گی۔ (کتاب: «وهذا إذا كان القتل خطأً، وكذا إذا كان عمداً والعبد القاتل صغير؛ لأن عمده خطأ، أما إذا كان كبيراً يجب القصاص؛ لجريانه بين الحرّ والعبد»۔)", "s": [{"t": "u", "v": "0:12:07"}, {"t": "u", "v": "0:12:10"}, {"t": "k", "v": "1905–1906", "v7": 1178}]}], "dalil": [{"x": "بچہ اور غلام اپنی باتوں پر پکڑے نہیں جاتے (استاد: مرفوع القلم)؛ بچے کا حکم کالعدم ہے۔ (کتاب: «لأنهما لا يؤاخذان بأقوالهما؛ لأن المؤاخذة فيها باعتبار الشرع، وما اعتبر قولهما»۔)", "s": [{"t": "u", "v": "0:09:11"}, {"t": "u", "v": "0:09:35"}, {"t": "k", "v": "1905–1906", "v7": 1178}, {"t": "s", "v": "بشریٰ ٨ جلدی، بین السطور"}]}, {"x": "فرق: غلام کی بات کا اعتبار نہ کرنا مولیٰ کے حق کی وجہ سے تھا، اس کی اہلیت کی کمی سے نہیں، آزادی سے وہ وجہ ختم ہو گئی؛ بچے کی اہلیت ہی ناقص ہے۔ (کتاب: «لأن عدم الاعتبار لحق المولى، وقد زال، لا لنقصان أهلية العبد، بخلاف الصبي؛ لأنه قاصر الأهلية»۔)", "s": [{"t": "u", "v": "0:10:07"}, {"t": "u", "v": "0:10:15"}, {"t": "k", "v": "1905–1906", "v7": 1178}]}], "ikhtilaf": [], "faida": [{"x": "حاشیہ: «العبد» کی قید اس لیے کہ آمر آزاد بالغ ہو تو بچے کی عاقلہ آمر کی عاقلہ سے رجوع کرے؛ «المحجور» کی قید اس لیے کہ مکاتب بالغ ہو تو اس سے (فوراً) اس کی قیمت اور دیت میں کم سے رجوع؛ ماذون آمر ہو تو بھی آزادی کے بعد ہی؛ «صبياً حراً» کی قید اس لیے کہ مامور بچہ غلام ہو تو دیت نہیں بلکہ دفع یا فدیہ۔", "s": [{"t": "s", "v": "الكفاية ٢٨٣/٩"}]}, {"x": "حاشیہ: غلام والی صورت میں دونوں کا محجور ہونا ضروری نہیں، آمر کا محجور ہونا کافی؛ آمر ماذون ہو تو قاتل کا مولیٰ (دفع یا فدیہ کے بعد) فی الحال آمر کی گردن سے اپنے غلام کی قیمت لے، کیونکہ اس کے حکم سے وہ (مامور کا) غاصب بنا، اور ماذون کا غصب کا اقرار غلامی میں بھی معتبر ہے۔", "s": [{"t": "s", "v": "الكفاية ٢٨٣/٩"}]}, {"x": "استاد (یہاں کتاب میں نہیں): قصاص والی صورت میں حکم دینے والے (غلام) کو کوئی تعزیری سزا دی جا سکتی ہے، مگر اس سے رجوع نہیں۔", "s": [{"t": "u", "v": "0:12:10"}]}], "lughat": [{"ar": "العبد المحجور عليه", "ur": "وہ غلام جسے آقا نے (تجارت وغیرہ کی) اجازت نہیں دی", "s": [{"t": "u", "v": "0:08:30"}]}, {"ar": "فعلى عاقلة الصبي الدية", "ur": "تو دیت بچے کی عاقلہ پر ہے", "s": [{"t": "u", "v": "0:10:22"}]}, {"ar": "ويرجعون على العبد الآمر بعد الإعتاق", "ur": "اور وہ آزادی کے بعد حکم دینے والے غلام سے واپس لیں گے (استاد کی قراءت: «ويرجعون بها على العبد بعد العتق»)", "s": [{"t": "u", "v": "0:09:55"}, {"t": "u", "v": "0:10:22"}]}, {"ar": "عمده وخطؤه سواء", "ur": "اس کا جان بوجھ کر اور غلطی سے کرنا برابر ہے", "s": [{"t": "u", "v": "0:08:58"}]}, {"ar": "قاصر الأهلية", "ur": "ناقص اہلیت والا", "s": [{"t": "u", "v": "0:10:15"}]}, {"ar": "يُخاطب مولى القاتل بالدفع أو الفداء", "ur": "قاتل کے مولیٰ سے غلام دینے یا فدیہ دینے کا مطالبہ ہوگا", "s": [{"t": "u", "v": "0:10:58"}, {"t": "u", "v": "0:12:41"}]}, {"ar": "غير مضطر في دفع الزيادة", "ur": "زیادہ دینے پر مجبور نہیں تھا", "s": [{"t": "u", "v": "0:11:55"}, {"t": "s", "v": "العناية ٢٨٣/٩"}]}]}, {"unit": "u8", "pages": [1906], "lesson": "2025-11-05", "ts": "0:12:48", "label": null, "title": "غلام نے دو آدمیوں کو جان بوجھ کر قتل کیا، ہر مقتول کے دو ولی (بیٹے) ہیں، ہر ایک کے دو میں سے ایک نے معاف کر دیا تو قصاص ساقط ہو کر مال بن گیا: مولیٰ غلام کا آدھا باقی دونوں کو دے یا دس ہزار درہم فدیہ دے (حق بیس ہزار یا پورے غلام میں تھا، معاف کرنے والوں کا آدھا ساقط)", "start": "قال: وإذا قتل العبدُ رجلين عمداً، ولكل واحد منهما وليان", "start_note": "بشریٰ ج٨ ص 178 (PDF 179) دسویں سطر کے آخر (≈0.95) سے ص 179 (PDF 180) چوتھی سطر «وبقي النصف» تک؛ حاشیہ: «قال» = امام محمد، الجامع الصغير (البناية ٢٩٦/١٣)۔ 0:12:48 عبارت کا شروع پڑھا، 0:12:54–0:14:41 سمجھایا، 0:15:01 مسئلے کی عبارت پڑھی (ٹرانسکرپٹ میں درمیان کا حصہ «فولی أحدہم [؟]» ناقص)؛ دلیل کی عربی نہیں پڑھی۔ کارڈ «فإن كان قتل أحدهما عمداً» (≈0.35) سے پہلے ختم۔", "norec": "", "badges": null, "exam": null, "v7": "بشریٰ ج٨ ص 178–179", "tamheed": [{"x": "ایک غلام نے دو آدمیوں کو جان بوجھ کر قتل کر دیا؛ دونوں (کے ورثاء) اس سے قصاص لے سکتے ہیں۔", "s": [{"t": "u", "v": "0:12:54"}, {"t": "u", "v": "0:13:05"}]}, {"x": "دونوں مقتولوں کے دو دو بیٹے ہیں؛ مقتول نمبر ایک کے بیٹوں میں سے ایک نے معاف کر دیا اور مقتول نمبر دو کے بیٹوں میں سے بھی ایک نے؛ ورثاء میں کوئی بھی معاف کر دے تو قصاص ختم، باقی ورثاء کا حصہ دیت میں بدل جاتا ہے۔", "s": [{"t": "u", "v": "0:13:11"}, {"t": "u", "v": "0:13:17"}, {"t": "u", "v": "0:13:36"}]}], "masala": [{"x": "دونوں کی دیت مل کر بیس ہزار درہم (ہر ایک کی دس ہزار)؛ ہر طرف سے آدھا معاف ہوا؛ مولیٰ کے پاس دو اختیار: (1) مولیٰ غلام کا آدھا حصہ باقی دونوں ولیوں کو دے دے (ہر ایک کو چوتھائی)؛ (2) بیس ہزار کی جگہ دس ہزار درہم دے کر غلام اپنے پاس رکھ لے۔ (کتاب: «فعفا أحد وليّي كلِّ واحد منهما: فإن المولى يدفع نصفه إلى الآخرين، أو يفديه بعشرة آلاف درهم»۔)", "s": [{"t": "u", "v": "0:14:02"}, {"t": "u", "v": "0:14:29"}, {"t": "u", "v": "0:15:01"}, {"t": "k", "v": "1906", "v7": 1179}]}], "dalil": [{"x": "ہر طرف سے ایک کے معاف کرنے سے قصاص ساقط ہو کر مال بن گیا، تو یہ ایسا ہے جیسے شروع سے مال واجب ہوا ہو؛ ان کا حق غلام کی ذات میں یا بیس ہزار میں تھا، معاف کرنے والوں کا حصہ (آدھا) ساقط، آدھا باقی؛ جس نے معاف کیا اس کا حصہ ختم، جس نے نہیں کیا اسے اس کے تناسب سے حصہ ملے گا۔ (کتاب: «لأنه لما عفا أحد ولي كل واحد منهما سقط القصاص وانقلب مالاً، فصار كما لو وجب المال من الابتداء؛ وهذا لأن حقهم في الرقبة، أو في عشرين ألفاً، وقد سقط نصيب العافيين، وهو النصف، وبقي النصف»؛ حاشیہ: شروع سے دونوں قتلوں کی وجہ سے مال واجب ہوتا تو آدھے آدھے میں ہوتا۔)", "s": [{"t": "u", "v": "0:13:36"}, {"t": "u", "v": "0:13:50"}, {"t": "u", "v": "0:14:02"}, {"t": "u", "v": "0:14:41"}, {"t": "k", "v": "1906", "v7": 1179}, {"t": "s", "v": "البناية ٢٩٦/١٣"}]}], "ikhtilaf": [], "faida": [], "lughat": [{"ar": "ولكل واحد منهما وليان", "ur": "اور دونوں (مقتولوں) میں سے ہر ایک کے دو ولی ہیں", "s": [{"t": "u", "v": "0:13:11"}]}, {"ar": "فعفا أحد وليّي كل واحد منهما", "ur": "ہر ایک کے دو ولیوں میں سے ایک نے معاف کر دیا", "s": [{"t": "u", "v": "0:13:36"}]}, {"ar": "يدفع نصفه إلى الآخرين", "ur": "غلام کا آدھا باقی دونوں (ولیوں) کو دے", "s": [{"t": "u", "v": "0:14:02"}, {"t": "u", "v": "0:15:01"}]}, {"ar": "أو يفديه بعشرة آلاف درهم", "ur": "یا دس ہزار درہم دے کر اسے چھڑا لے", "s": [{"t": "u", "v": "0:14:29"}, {"t": "u", "v": "0:15:01"}]}, {"ar": "انقلب مالاً", "ur": "(قصاص) مال میں بدل گیا", "s": [{"t": "u", "v": "0:13:36"}]}, {"ar": "نصيب العافيين", "ur": "معاف کرنے والے دونوں کا حصہ", "s": [{"t": "u", "v": "0:14:41"}]}]}, {"unit": "u8", "pages": [1906, 1907], "lesson": "2025-11-05", "ts": "0:15:20", "label": null, "title": "غلام نے ایک کو جان بوجھ کر اور ایک کو غلطی سے قتل کیا، عمد کے دو ولیوں میں سے ایک نے معاف کر دیا: فدیہ دے تو پندرہ ہزار (پانچ ہزار عمد کے باقی ولی کو، دس ہزار خطا کے ولیوں کو)؛ غلام دے تو امام ابو حنیفہ: تہائی تہائی (دو تہائی خطا والوں کو، ایک تہائی عمد کے باقی ولی کو، عول و مضاربت کے طریقے سے)؛ صاحبین: چوتھائی (تین چوتھائی خطا والوں کو، ایک چوتھائی عمد والے کو، منازعت کے طریقے سے)", "start": "فإن كان قتل أحدهما عمداً، والآخر خطأً، فعفا أحدُ وليّي العمد", "start_note": "بشریٰ ج٨ ص 179 چوتھی سطر کے آخر (≈0.35) سے ص 180 (PDF 181، فائل p0181-0185.md کا پہلا حصہ، OCR لیبل «PDF 1 | 180») چوتھی سطر «ذكرناها في الزيادات» تک؛ 0:15:20 عبارت کا شروع پڑھا، 0:15:22–0:17:59 سمجھایا، 0:18:09 مسئلے کی عبارت پڑھی (ٹرانسکرپٹ میں «أثلاثا ثلاثا [؟]» اور «أربعة أخماس [؟] ثلاثة أرباع» ناقص)؛ دلیل کی عربی نہیں پڑھی۔ کارڈ «قال: وإذا كان عبد بين رجلين» (≈0.8) سے پہلے ختم۔", "norec": "", "badges": null, "exam": null, "v7": "بشریٰ ج٨ ص 179–180", "tamheed": [{"x": "ایک قتل عمد تھا اور ایک قتل خطا؛ عمد والی صورت میں قصاص ہے، خطا والی صورت میں دیت۔", "s": [{"t": "u", "v": "0:15:22"}, {"t": "u", "v": "0:15:23"}]}, {"x": "قتل عمد والے (مقتول) کے دو بیٹے تھے، ایک نے معاف کر دیا؛ تو اس نے اپنا آدھا حصہ معاف کر دیا اور دوسرے کا حصہ دیت میں بدل گیا: پانچ ہزار درہم۔", "s": [{"t": "u", "v": "0:15:33"}, {"t": "u", "v": "0:15:40"}, {"t": "u", "v": "0:15:46"}, {"t": "u", "v": "0:15:55"}]}], "masala": [{"x": "مولیٰ پیسے (فدیہ) دینا چاہے تو پندرہ ہزار درہم دے گا: پانچ ہزار عمد کے اس ولی کو جس نے معاف نہیں کیا، اور دس ہزار (پوری دیت) خطا کے ولی کو۔ (کتاب: «فإن فداه المولى فداه بخمسة عشر ألفاً: خمسة آلاف للذي لم يعف من وليّي العمد، وعشرة آلاف لولي الخطأ»۔)", "s": [{"t": "u", "v": "0:16:06"}, {"t": "u", "v": "0:16:22"}, {"t": "u", "v": "0:18:09"}, {"t": "k", "v": "1906–1907", "v7": 1179}]}, {"x": "آقا کہے کہ پیسے نہیں، غلام دوں گا: امام ابو حنیفہ کے ہاں غلام تین حصے کر کے دیا جائے گا: دو حصے خطا کے ولیوں کو، ایک حصہ عمد کے اس ولی کو جس نے معاف نہیں کیا۔ (کتاب: «وإن دفعه دفعه إليهم أثلاثاً: ثلثاه لولي الخطأ، وثلثه لغير العافي من ولي العمد عند أبي حنيفة»۔)", "s": [{"t": "u", "v": "0:16:27"}, {"t": "u", "v": "0:16:37"}, {"t": "u", "v": "0:18:09"}, {"t": "k", "v": "1906–1907", "v7": 1179}]}, {"x": "صاحبین: غلام چار حصے: تین چوتھائی خطا کے ولیوں کو، ایک چوتھائی عمد کے (معاف نہ کرنے والے) ولی کو۔ (کتاب: «وقالا: يدفعه أرباعاً: ثلاثة أرباعه لولي الخطأ، وربعه لولي العمد»۔)", "s": [{"t": "u", "v": "0:17:01"}, {"t": "u", "v": "0:17:33"}, {"t": "u", "v": "0:18:09"}, {"t": "k", "v": "1906–1907", "v7": 1179}]}], "dalil": [{"x": "فدیہ کی دلیل: عمد مال میں بدل گیا تو خطا کے ولی کا حق پوری دیت دس ہزار میں، اور عمد کے ایک ولی کا حق اس کے آدھے پانچ ہزار میں؛ فدیہ (ذمے کی چیز) میں تنگی نہیں، تو پندرہ ہزار واجب۔ (کتاب: «لأنه لما انقلب العمد مالاً كان حق ولي الخطأ في كل الدية عشرة آلاف، وحق أحد ولي العمد في نصفها خمسة آلاف، ولا تضايق في الفداء، فتجب خمسة عشر ألفاً»۔)", "s": [{"t": "u", "v": "0:15:46"}, {"t": "u", "v": "0:16:06"}, {"t": "k", "v": "1906–1907", "v7": 1179}]}, {"x": "صاحبین کی دلیل (منازعت): ولیِ عمد کا حق پورے غلام میں تھا؛ ایک نے معاف کیا تو اس کا حق باطل اور آدھا غلام خالی ہو گیا، وہ آدھا بغیر جھگڑے ولیِ خطا کو ملے گا؛ باقی آدھے میں ولیِ خطا اور عمد کا خاموش (معاف نہ کرنے والا) ولی برابر جھگڑتے ہیں، تو وہ دونوں میں آدھا آدھا؛ یوں ولیِ خطا کو تین چوتھائی اور عمد والے کو ایک چوتھائی۔ (استاد نے 0:17:01 پر اسے اپنے انداز میں سمجھایا، دیکھیں NOTES۔) (کتاب: «فالقسمة عندهما بطريق المنازعة، فيسلم النصف لولي الخطأ بلا منازعة، واستوت منازعة الفريقين في النصف الآخر فيتنصف، فلهذا يقسم أرباعاً»؛ حاشیہ: «الفريقين» = ولیِ خطا اور عمد کا ایک ولی؛ جیسے فضولی کی بیع: ایک فضولی نے پورا غلام بیچا، دوسرے نے آدھا، مالک نے دونوں کی اجازت دی تو غلام دونوں خریداروں میں چوتھائی کے حساب سے۔)", "s": [{"t": "u", "v": "0:17:01"}, {"t": "u", "v": "0:17:16"}, {"t": "u", "v": "0:17:33"}, {"t": "u", "v": "0:17:59"}, {"t": "k", "v": "1906–1907", "v7": 1179}, {"t": "k", "v": "1907", "v7": 1180}, {"t": "s", "v": "البناية"}, {"t": "s", "v": "العناية ٢٨٤/٩"}]}, {"x": "امام ابو حنیفہ کی دلیل (کتاب): ان کے ہاں تقسیم عول اور مضاربت کے طریقے سے، کیونکہ حق (ارش کے طور پر) غلام سے متعلق ہے؛ اس کی اصل وہ ترکہ ہے جسے قرضے گھیر لیں: یہ (خطا والا) پورے (دس ہزار) کے حساب سے حصہ لے گا اور وہ (عمد والا) آدھے (پانچ ہزار) کے حساب سے، تو دو اور ایک = تہائی۔ استاد نے اس کی وجہ گنتی سے بتائی: عمد والا ایک رہ گیا، خطا والے دو، کل تین، تو تین حصے (دیکھیں NOTES)۔ (کتاب: «وعنده يقسم بطريق العول والمضاربة أثلاثاً؛ لأن الحق تعلق بالرقبة، أصله التركة المستغرقة بالديون، فيضرب هذا بالكل، وذلك بالنصف، ولهذه المسألة نظائر وأضداد ذكرناها في الزيادات»۔)", "s": [{"t": "u", "v": "0:16:37"}, {"t": "k", "v": "1907", "v7": 1180}, {"t": "s", "v": "العناية ٢٨٤/٩"}]}], "ikhtilaf": [], "faida": [{"x": "حاشیہ (اصول): جو عین کی تقسیم ذمے کے کسی قرض کی وجہ سے ہو (جیسے ترکے میں دو قرض خواہ) وہ عول و مضاربت سے ہوتی ہے، کیونکہ ذمے میں تنگی نہیں اور ہر ایک کا حق پورا ثابت ہوتا ہے؛ اور جو عین میں ابتداءً ہو (جیسے فضولی کی بیع) وہ منازعت سے۔ امام ابو حنیفہ کے ہاں یہاں حق اصل میں غلام کی ذات میں نہیں بلکہ ارش میں ہے؛ مثال: کسی پر تین ہزار قرض، دو ہزار ایک کا اور ایک ہزار دوسرے کا، وہ ایک ہزار چھوڑ کر مرا تو ترکہ دونوں میں تہائی تہائی (دو تہائی دو ہزار والے کو)۔", "s": [{"t": "s", "v": "العناية ٢٨٤/٩"}]}, {"x": "حاشیہ: عول کا معنی: ہر ایک اپنے حصے کے حساب سے لے، سب حصے جمع کر کے ان کے مجموعے پر تقسیم کیا جائے۔", "s": [{"t": "s", "v": "البناية ٢٩٧/١٣"}]}], "lughat": [{"ar": "فإن فداه المولى", "ur": "اگر مولیٰ فدیہ دے (پیسے دے کر غلام رکھے)", "s": [{"t": "u", "v": "0:16:06"}, {"t": "u", "v": "0:18:09"}] , {"t": "u", "v": "0:28:10"}]}, {"ar": "بإهدار الأدنى", "ur": "کم درجے والے (مالیت کے پہلو) کو چھوڑ کر", "s": [{"t": "u", "v": "0:28:34"}]}, {"ar": "إظهاراً لانحطاط رتبته", "ur": "اس کے رتبے کی کمی ظاہر کرنے کے لیے", "s": [{"t": "u", "v": "0:28:34"}]}, {"ar": "الغصب لا يرد إلا على المال", "ur": "غصب صرف مال پر ہی ہوتا ہے", "s": [{"t": "u", "v": "0:29:11"}]}]}, {"unit": "u9", "pages": [1908], "lesson": "2025-11-06", "ts": "0:00:13", "label": null, "title": "غلام کا ہاتھ کاٹا تو اس کی آدھی قیمت، مگر پانچ ہزار درہم میں سے پانچ کم (4995) سے زیادہ نہیں (غلام کا درجہ کم ظاہر کرنے کے لیے)؛ آزاد کی دیت میں جو حصہ مقرر ہے، غلام کی قیمت میں بھی وہی حصہ؛ باندی غصب کی اور غاصب کے پاس مر گئی تو پوری قیمت، چاہے بیس ہزار ہو (غصب کا ضمان مالیت کا ضمان ہے)", "start": "قال: وفي يد العبد نصف قيمته لا يزاد على خمسة آلاف إلا خمسة", "start_note": "بشریٰ ج٨ ص 184 (PDF 185، فائل p0181-0185.md کا پانچواں حصہ)، پانچویں سطر کے شروع، «وتعيين العشرة بأثر عبد الله بن عباس» کے بعد (≈0.67)؛ بین السطور: «قال» = القدوري۔ 0:00:13 عبارت پڑھی، 0:00:19–0:02:24 پچھلے مسئلے (قتل میں دس ہزار سے دس کم) کی یاد دہانی کے ساتھ سمجھایا، 0:02:24 دوبارہ پڑھی اور 0:02:27 ترجمہ؛ «لأن اليد من الآدمي نصفه …» سے آگے کی عربی نہیں پڑھی۔ کتاب ص 184 سے ص 185 تیسری سطر «لما بينا أن ضمان الغصب ضمان المالية» تک؛ کارڈ «قال: ومن قطع يد عبد» (≈0.28) سے پہلے ختم۔", "norec": "", "badges": null, "exam": null, "v7": "بشریٰ ج٨ ص 184–185", "tamheed": [{"x": "پچھلی کلاس: کسی نے غلام کو قتل کیا تو دیت نہیں، پوری قیمت ہے؛ مگر وہ آزاد آدمی کی دیت سے زیادہ تو کیا، اس کے برابر بھی نہیں ہونی چاہیے، تقریباً دس درہم کم ہونی چاہیے۔", "s": [{"t": "u", "v": "0:00:19"}, {"t": "u", "v": "0:00:31"}]}, {"x": "آزاد آدمی کا ایک ہاتھ کاٹنے میں آدھی دیت ہے، یعنی پانچ ہزار درہم؛ تو غلام کا ہاتھ کاٹنے میں پانچ ہزار سے کچھ کم ہونا چاہیے۔", "s": [{"t": "u", "v": "0:00:40"}, {"t": "u", "v": "0:00:51"}]}], "masala": [{"x": "پوری جان میں دس ہزار سے دس کم کرتے ہیں تو ہاتھ میں پانچ ہزار سے پانچ کم؛ (آدھی) قیمت 4995 سے کم ہو تو پوری دینی ہوگی، اس سے زیادہ ہو تو اس  وہی ایک مولیٰ ہے؛ جس کے لیے فیصلہ ہوگا (مقضی لہ) معلوم ہے اور حکم بھی ایک (قصاص)؛ پہلی صورت میں مقضی لہ مجہول تھا (غلامی دیکھیں تو آقا، آزادی دیکھیں تو ورثاء)، اس لیے وہاں قصاص ممکن نہیں تھا۔ (کتاب: «ولهما: أنا تيقنا بثبوت الولاية للمولى، فيستوفيه؛ وهذا لأن المقضيَّ له معلوم، والحكم متَّحد، فوجب القول بالاستيفاء، بخلاف الفصل الأول؛ لأن المقضيّ له مجهول»۔)", "s": [{"t": "u", "v": "0:09:12"}, {"t": "u", "v": "0:09:30"}, {"t": "k", "v": "1909–1910", "v7": 1187}, {"t": "s", "v": "العناية ٢٩٠/٩"}]}, {"x": "امام محمد کے «سبب مختلف» کا جواب: سبب کے اختلاف سے فرق نہیں پڑتا جب حکم ایک ہو؛ باندی والے مسئلے میں سبب کے ساتھ حکم بھی مختلف ہے: خریدنے میں ملکِ یمین، مولیٰ کے دعوے کے مطابق ملکِ نکاح، یہ حکم کے لحاظ سے بھی الگ الگ ہیں، اس لیے وہاں وطی کی اجازت نہیں۔ (کتاب: «ولا معتبر باختلاف السبب ههنا؛ لأن الحكم لا يختلف، بخلاف تلك المسألة؛ لأن ملك اليمين يغاير ملك النكاح حكماً»؛ حاشیہ: ملکِ نکاح حلت کو مقصوداً ثابت کرتی ہے، ملکِ یمین کبھی ثابت نہیں کرتی اور کرے تو مقصوداً نہیں۔)", "s": [{"t": "u", "v": "0:09:52"}, {"t": "u", "v": "0:10:00"}, {"t": "k", "v": "1909–1910", "v7": 1187}, {"t": "s", "v": "الكفاية ٩ / ٢٩٠ - ٢٩١"}, {"t": "s", "v": "العناية"}]}, {"x": "«آزادی سرایت کاٹ دیتی ہے» کا جواب: آزادی بذاتِ خود سرایت کو نہیں روکتی، بلکہ اس لیے کہ حق دار مجہول ہو جاتا ہے؛ اور یہ اشتباہ قتلِ خطا میں آتا ہے، عمد میں نہیں: خطا میں مال کا معاملہ ہے، غلام ہو تو مولیٰ قیمت لے، اور موت کے وقت آزاد ہو تو دیت میت کی، اسی سے اس کے قرضے دیے جائیں، وصیت نافذ ہو، باقی ورثاء کو؛ عمد میں تو قصاص واجب ہوتا ہے، مال نہیں۔ (کتاب: «والإعتاق لا يقطع السراية لذاته، بل لاشتباه مَنْ له الحق، وذلك في الخطأ دون العمد؛ لأن العبد لا يصلح مالكاً للمال، فعلى اعتبار حالة الجرح يكون الحقُّ للمولى، وعلى اعتبار حالة الموت يكون للميت لحريته، فيقضي منه ديونه، وينفذ وصاياه، فأما العمد فموجبه القصاص»؛ حاشیہ: خطا میں زخمی کیا، پھر آزادی، پھر موت تو سرایت کٹ جاتی ہے، نہ دیت نہ قیمت۔)", "s": [{"t": "u", "v": "0:10:30"}, {"t": "u", "v": "0:10:50"}, {"t": "u", "v": "0:11:13"}, {"t": "u", "v": "0:11:30"}, {"t": "k", "v": "19 ": [{"x": "عام طور پر کوئی کسی کا ہاتھ کاٹے اور وہ اس سے مر جائے تو موت کی نسبت ہاتھ کاٹنے کی طرف ہوتی ہے؛ مگر یہ نسبت کبھی کٹ جاتی ہے، جیسے پیچھے پڑھا کہ آزادی سے زخم کی طرف نسبت ختم ہو جاتی ہے؛ اسی طرح غصب سے بھی۔", "s": [{"t": "u", "v": "0:13:48"}, {"t": "u", "v": "0:13:51"}, {"t": "u", "v": "0:13:58"}, {"t": "u", "v": "0:14:03"}, {"t": "u", "v": "0:14:08"}, {"t": "u", "v": "0:14:15"}]}, {"x": "کیونکہ غصب سے ملکیت بدل جاتی ہے: کوئی کسی چیز کو غصب کر کے کھا لے یا مار دے تو اس پر ضمان آتا ہے اور وہ غصب کے دن سے اس کا مالک شمار ہوتا ہے؛ تو غصب سرایت کو کاٹ دیتا ہے، اب موت کی نسبت پچھلے ہاتھ کی طرف نہیں ہوگی، گویا وہ آسمانی آفت سے مرا؛ اس لیے ہاتھ کٹے غلام کی قیمت۔ (کتاب: «والفرق: أن الغصب قاطع للسراية؛ لأنه سبب الملك كالبيع، فيصير كأنه هلك بآفة سماوية، فتجب قيمته أقطع»؛ حاشیہ: ضمان والی چیزیں ضمان ادا کرنے پر غصب کے شروع سے ملک ہو جاتی ہیں؛ بیع بھی سرایت کاٹتی ہے کیونکہ جنایت کی ابتدا ایک کی ملک میں اور انتہا دوسرے کی ملک میں ہو تو مستحق مجہول ہو جاتا ہے۔)", "s": [{"t": "u", "v": "0:14:21"}, {"t": "u", "v": "0:14:29"}, {"t": "u", "v": "0:14:39"}, {"t": "u", "v": "0:14:52"}, {"t": "u", "v": "0:15:29"}, {"t": "k", "v": "1913", "v7": 1196}, {"t": "k", "v": "1913", "v7": 1197}, {"t": "s", "v": "البناية ٣١٦/١٣"}, {"t": "s", "v": "الكفاية ٢٩٨/٩"}]}, {"x": "دوسری صورت میں کوئی ایسی چیز نہیں پائی گئی جو سرایت کاٹ دے، تو قتل کی نسبت مولیٰ ہی کی طرف ہوگی؛ گویا مولیٰ نے خود غلام واپس لے کر قتل کیا؛ اس لیے غاصب پر ضمان نہیں۔ (کتاب: «ولم يوجد القاطع في الفصل الثاني، فكانت السراية مضافةً إلى البداية، فصار المولى متلفاً، فيصير مسترداً، كيف؟ وأنه استولى عليه، وهو استرداد، فيبرأ الغاصبُ عن الضمان»؛ حاشیہ: جیسے مشتری قبضے سے پہلے مبیع کا ہاتھ کاٹ دے تو قبضہ کرنے والا ہو جاتا ہے۔)", "s": [{"t": "u", "v": "0:15:34"}, {"t": "u", "v": "0:15:39"}, {"t": "u", "v": "0:15:44"}, {"t": "u", "v": "0:15:49"}, {"t": "u", "v": "0:15:53"}, {"t": "k", "v": "1913", "v7": 1197}, {"t": "s", "v": "الكفاية ٢٩٧/٩"}]}], "ikhtilaf": [], "faida": [{"x": "استاد کی مثال: کسی نے بیمار بھینس غصب کی اور وہ غاصب ک  "0:27:02"}, {"t": "u", "v": "0:27:16"}, {"t": "u", "v": "0:27:20"}, {"t": "u", "v": "0:27:26"}, {"t": "u", "v": "0:27:29"}, {"t": "u", "v": "0:27:31"}, {"t": "u", "v": "0:27:33"}, {"t": "u", "v": "0:27:34"}, {"t": "u", "v": "0:27:38"}, {"t": "k", "v": "1915", "v7": 1200}, {"t": "s", "v": "بشریٰ ٨ جلدی، بین السطور"}]}, {"x": "اس کی آدھی قیمت پہلے کو دے گا، اور پھر اس کا رجوع غاصب پر کرے گا (اور وہ مولیٰ کے پاس رہے گی، نہ پہلے ولی کو دے گا نہ دوسرے کو)۔ (کتاب: «فيدفع نصفها إلى الأول؛ لأنه استحق كل القيمة؛ لأن عند وجود الجناية عليه لا حق لغيره، وإنما انتقص بحكم المزاحمة من بعد. قال: ويرجع به على الغاصب؛ لأن الاستحقاق بسبب كان في يده، ويسلم له، ولا يدفعه إلى ولي الجناية الأولى، ولا إلى ولي الجناية الثانية؛ لأنه لا حق له إلا في النصف لسبق حق الأول، وقد وصل ذلك إليه»؛ حاشیہ: «ويرجع به» = اس نصف کے ساتھ جو دوسری بار پہلے ولی کو دیا؛ «فيدفع نصفها» = نصف قیمت ولیِ جنایتِ اولیٰ کو۔)", "s": [{"t": "u", "v": "0:27:42"}, {"t": "u", "v": "0:27:43"}, {"t": "u", "v": "0:27:46"}, {"t": "u", "v": "0:27:47"}, {"t": "u", "v": "0:27:48"}, {"t": "k", "v": "1915", "v7": 1200}, {"t": "s", "v": "البناية"}]}], "dalil": [{"x": "امام محمد کا فرق (استاد کے الفاظ میں): پچھلی صورت میں مولیٰ غاصب سے اتنا ہی لے گا جتنا (غاصب کے پاس والی جنایت کے بدلے) دیا، کیونکہ دوسری جنایت مولیٰ کے ہاتھ میں ہوئی تھی؛ اس مسئلے میں دونوں جنایتیں غاصب کے ہاتھ میں ہوئیں، تو دونوں کا مطالبہ اس سے لے سکتا ہے۔ (کتاب: «والفرق لمحمد: أن في الأولى الذي يرجع به عوض عما سلم لولي الجناية الأولى؛ لأن الجناية الثانية كانت في يد المالك، فلو دفع إليه ثانياً: يتكرر الاستحقاق، أما في هذه المسألة: فيمكن أن يجعل عوضاً عن الجناية الثانية؛ لحصولها في يد الغاصب، فلا يؤدي إلى ما ذكرناه»۔)", "s": [{"t": "u", "v": "0:27:59"}, {"t": "u", "v": "0:28:03"}, {"t": "k", "v": "1915", "v7": 1201}, {"t": "s", "v": "النهاية"}]}], "ikhtilaf": [{"x": "غاصب سے پوری قیمت لینا متن میں بلا اختلاف ہے («ثم يرجع بقيمته على الغاصب»)۔ اختلاف اس میں ہے کہ مولیٰ باقی آدھا پہلے ولی کو دے اور پھر دوسری بار غاصب سے لے یا نہیں: کتاب میں دو قول (مشائخ کے): «ثم قيل: ل محلہ پر دیت کا فیصلہ ہوگا اور ولی سے قسم نہیں لی جائے گی؛ امام شافعی: دیت واجب نہیں («تبرئكم اليهود بأيمانها»، اور قسم شریعت میں بری کرتی ہے لازم نہیں کرتی)؛ ہماری دلیل: آپ ﷺ نے (ایک روایت میں) دیت اور قسامت جمع کیں اور حضرت عمرؓ نے وادعہ پر؛ «تبرئكم» قصاص اور قید سے بری ہونا ہے؛ دیت ظاہری قتل یا حفاظت کی کوتاہی سے ہے، جیسے قتل خطا؛ جو قسم سے انکار کرے اسے قسم کھانے تک قید کیا جائے، کیونکہ یہاں قسم خود مقصود ہے (خون کی عظمت)", "start": "قال: فإذا حلفوا: قضي على أهل المحلة بالدية، ولا يُستحلف الوليُّ", "start_note": "بشریٰ ج٨ ص 210 نویں سطر کے بیچ «وليس بشهادة.» کے بعد (≈0.82)؛ بین السطور: «قال» = القدوري۔ استاد نے 0:17:26 والی لمبی سطر (0:17:26–0:26:55، بیچ میں کوئی وقت درج نہیں) میں اپنے نسخے کا «صفحہ نمبر 2047» کہہ کر «وإذا حلفوا» سے یہ مسئلہ سمجھایا، پھر «وإذا حلفوا قضي على أهل المحلة … ولا يستحلف الولي» اور «ومن أبى منهم اليمين حبس حتى يحلف» پڑھ کر سمجھایا (کتاب میں «فإذا حلفوا»)۔ کارڈ ص 212 چھٹی سطر «وفيما نحن فيه لا يسقط ببذل الدية» تک؛ «هذا الذي ذكرنا إذا ادعى الولي القتل على جميع أهل المحلة» (≈0.62) سے پہلے ختم۔", "norec": "", "badges": null, "exam": null, "v7": "بشریٰ ج٨ ص 210–212", "tamheed": [{"x": "50 لوگوں نے قسم کھا لی کہ نہ ہم نے قتل کیا نہ ہمیں قاتل معلوم ہے؛ اب کیا ہوگا؟", "s": [{"t": "u", "v": "0:17:26"}]}], "masala": [{"x": "قسم کے بعد بھی اہل محلہ کے عاقلہ پر دیت کا فیصلہ ہوگا، اور ولی قسم نہیں کھائے گا؛ یہ ہمارا قول ہے۔ (کتاب: «فإذا حلفوا: قضي على أهل المحلة بالدية، ولا يُستحلف الوليُّ»؛ حاشیہ: «على أهل المحلة» یعنی اہل محلہ کے عاقلہ پر، المبسوط: تین سال میں، کیونکہ جب خطا سے خود قتل کرنے والے کی دیت عاقلہ پر تین سال میں ہے تو یہاں بدرجۂ اولیٰ۔)", "s": [{"t": "u", "v": "0:17:26"}, {"t": "k", "v": "1919", "v7": 1210}, {"t": "s", "v": "الكفاية ٣٠٧/٩-٣٠٨"}]}, {"x": "50 میں سے کوئی قسم سے انکار کرے تو قسم کھانے تک قید کیا جائے گا۔ (کتاب: «ومن أبى منهم اليمين: حُبِس حتى يحلف»؛ حاشیہ: یعنی ان پچاس میں سے جنہیں ولی نے چنا۔)", "s": [{"t": "u", "v": "0:17:26"}, {"t": "k", "v": "1919–1920", "v7": 1212}, {"t": "s", "v": "البناية"}]}], "dalil": [{"x": "ہم     ${quick}${words}${exam}
    </div>
  </article>`;
}).join("");
const ARTS = [...document.querySelectorAll("article.card")];
const usedT = new Set();
CARDS.forEach((c) => {
  DATA.sections.forEach(([k]) => (c[k] || []).forEach((it) => it.s.forEach((x) => usedT.add(x.t))));
  (c.lughat || []).forEach((w) => w.s.forEach((x) => usedT.add(x.t)));
});
document.querySelectorAll(".legend .lg").forEach((el) => { el.hidden = !usedT.has(el.dataset.t); });
$("foot").innerHTML = (DATA.footer || []).map((p) => `<p>${esc(p)}</p>`).join("");

// ---------- views
function showToc(msg) {
  $("tocView").hidden = false; $("unitView").hidden = true; document.body.classList.remove("unit");
  $("tocMsg").hidden = !msg; if (msg) $("tocMsg").innerHTML = msg;
  document.title = `${B.kitab} · ${B.book}`;
  const last = store.get(`${KEY}-unit`, "");
  const row = last && $(`toc-${last}`);
  if (row && !msg) row.scrollIntoView({ block: "center" }); else window.scrollTo(0, 0);
}
function showUnit(key, page, msg) {
  const u = unitByKey[key];
  $("tocView").hidden = true; $("unitView").hidden = false; document.body.classList.add("unit");
  const par = u.level > 1 ? parentOf(u) : null;
  $("ubarTitle").textContent = u.title;
  $("uParent").textContent = par ? par.title : "";
  $("uParent").hidden = !par;
  $("uTitle").textContent = u.title;
  const ps = pagesOf(key), n = cardsOf(key).length;
  $("uMeta").innerHTML = (PAGED && u.page ? `ص <span class="ltr num">${range(u.page, u.page_to || u.page)}</span>، ` : "") + (n ? `${n} ${esc(ONE)}` : "ابھی کارڈ نہیں");
  $("pbar").innerHTML = (ps.length > 1 || page ? [`<a href="#${key}" aria-current="${!page}">سب</a>`, ...ps.map((p) =>
    `<a href="#${key}-${p}" aria-current="${page === p}">${p}</a>`)].join("") : "");
  $("pbar").hidden = !$("pbar").innerHTML;
  const allView = !page && !$("pbar").hidden;   // the «سب» chip is selected: cards start folded
  document.body.classList.toggle("allview", allView);
  $("toggleAll").hidden = !allView;
  let shown = 0;
  ARTS.forEach((a) => {
    const on = a.dataset.unit === key && (!page || a.dataset.pages.split("|").includes(String(page)));
    a.hidden = !on; if (on) shown++;
    setFold(a, allView);
  });
  syncToggleAll();
  if (page && !shown && !msg) msg = `صفحہ ${page} کا کوئی ${esc(ONE)} ابھی نہیں بنا۔`;
  $("uMsg").hidden = !msg; if (msg) $("uMsg").innerHTML = msg;
  const gs = gapsOf(key).filter((g) => !page || (g.page_list || []).includes(page));
  $("gaps").hidden = !gs.length;
  $("gapsTitle").textContent = n ? "اس حصے کی وہ عبارت جو استاد نے نہیں سمجھائی" : "اس حصے کی ریکارڈنگ نہیں ملی";
  $("gapsLead").textContent = n ? "یہ باتیں کارڈوں میں متن اور حاشیے سے لکھی گئی ہیں؛ ریکارڈنگ میں ان کی وضاحت نہیں۔"
    : "کسی ساتھی کے پاس اس حصے کی ریکارڈنگ ہو تو بھیج دیں، اس کے کارڈ بھی بن جائیں گے۔";
  $("gapList").innerHTML = gs.map((g) => `<li><span class="gp">${PAGED && g.pages ? "ص " + iso(esc(g.pages)) : ""}</span><span class="gt">${esc(g.text)}</span>${g.v7 ? `<span class="gv">${iso(esc(g.v7))}</span>` : ""}</li>`).join("");
  const i = UNITS.indexOf(u), prev = UNITS[i - 1], next = UNITS[i + 1];
  $("unav").innerHTML = (prev ? `<a class="prev" href="#${prev.key}"><span class="k">پچھلا حصہ</span><span class="t" lang="ar">${esc(prev.title)}</span></a>` : "") +
    (next ? `<a class="next" href="#${next.key}"><span class="k">اگلا حصہ</span><span class="t" lang="ar">${esc(next.title)}</span></a>` : "");
  document.title = `${u.title} · ${B.kitab}`;
  store.set(`${KEY}-unit`, key);
  window.scrollTo(0, 0);
}
function findPage(p) {
  const withCards = UNITS.find((u) => pagesOf(u.key).includes(p));
  if (withCards) return { unit: withCards.key, page: p };
  const inRange = [...UNITS].reverse().find((u) => u.page && u.page <= p && p <= (u.page_to || u.page));
  if (inRange) return { unit: inRange.key, page: p };
  return null;
}
function outsideMsg(p) {
  const k = (DATA.kitabs || []).find((x) => x.from <= p && p <= x.to);
  if (!k) return `صفحہ ${p} اس کتاب میں نہیں۔`;
  if (k.href) return `صفحہ ${p} <a href="${k.href}#p${p}">${esc(k.title)}</a> میں ہے۔`;
  return `صفحہ ${p} «${esc(k.title)}» میں ہے؛ اس کے کارڈ ابھی نہیں بنے۔`;
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  let m;
  if ((m = h.match(/^p(\d+)$/))) {
    const p = +m[1], f = findPage(p);
    if (f) { history.replaceState(null, "", `#${f.unit}-${p}`); return showUnit(f.unit, p); }
    return showToc(outsideMsg(p));
  }
  if ((m = h.match(/^(u\d+)(?:-(\d+))?$/)) && unitByKey[m[1]]) return showUnit(m[1], m[2] ? +m[2] : null);
  if (!h && UNITS.length === 1) return showUnit(UNITS[0].key, null);   // nothing to choose from
  showToc();
}
window.addEventListener("hashchange", route);
document.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-jump]");
  if (!f) return;
  e.preventDefault();
  const v = toLatin(f.querySelector("input").value || "");
  if (!/^\d+$/.test(v)) return;
  const p = +v, hit = findPage(p);
  if (hit) location.hash = `${hit.unit}-${p}`;
  else showToc(outsideMsg(p));
});
// folding: «سب تفصیل» opens or folds every card shown; each card's دلیل/اختلاف (details.more) stays as the reader left it
function setFold(a, fold) {
  a.classList.toggle("folded", fold);
  const t = a.querySelector(".ctoggle");
  t.setAttribute("aria-expanded", String(!fold));
  t.textContent = fold ? "تمہید اور تفصیل" : "تفصیل بند کریں";
}
function syncToggleAll() {
  const anyFolded = ARTS.some((a) => !a.hidden && a.classList.contains("folded"));
  $("toggleAll").setAttribute("aria-pressed", String(!anyFolded));
  $("toggleAll").textContent = anyFolded ? "سب تفصیل کھولیں" : "سب تفصیل بند کریں";
}
$("toggleAll").addEventListener("click", () => {
  const anyFolded = ARTS.some((a) => !a.hidden && a.classList.contains("folded"));
  ARTS.forEach((a) => { if (!a.hidden) setFold(a, !anyFolded); });
  syncToggleAll();
});
$("cards").addEventListener("click", (e) => {
  const t = e.target.closest(".ctoggle");
  if (!t) return;
  const a = t.closest("article.card");
  const wasOpen = !a.classList.contains("folded");
  setFold(a, wasOpen);
  if (wasOpen && a.getBoundingClientRect().top < 0) a.scrollIntoView({ block: "start" });   // folding a long card: keep it in view
  syncToggleAll();
});
route();

// ---------- recordings: light (Opus) copies on this site
const hasWeb = (l) => !!(LES[l] && LES[l].web && LES[l].web.length);
const webOk = (l) => hasWeb(l) && (OPUS_OK || !/\.ogg$/i.test(LES[l].web[0].src));
const NO_OPUS = "یہ براؤزر یہاں کی ہلکی فائلیں (Opus) نہیں چلاتا۔ آئی فون پر iOS 18.4 یا نیا ورژن چاہیے؛ اینڈرائیڈ پر Chrome میں کھولیں۔";
let current = null, sheetMode = null;
const blobUrls = {}, triedBlob = {};
let curPart = null, lastOffset = 0, pendingSeek = null;
function webPart(l, sec) {
  let p = LES[l].web[0];
  for (const x of LES[l].web) if (x.start <= sec + 0.5) p = x;
  return p;
}
function recRow(l) {
  const L = LES[l], btns = [];
  if (webOk(l)) btns.push(`<button type="button" class="btn" data-ts="0:00:00" data-l="${l}">${ICON.play}شروع سے سنیں</button>`);
  if (hasWeb(l)) {   // one button per lesson, whatever the number of parts
    const mb = L.web.reduce((a, p) => a + (p.mb || 0), 0);
    btns.push(`<button type="button" class="btn ghost" data-dl="${l}">${ICON.down}ڈاؤن لوڈ${L.web.length > 1 ? ` (${L.web.length} حصے)` : ""}${mb ? ` ${sizeMB(mb)}` : ""}</button>`);
  }
  const mins = L.minutes ? `${Math.round(L.minutes)} منٹ` : "";
  const state = webOk(l) ? `<span class="state on">یہیں چلتی ہے</span>` : (hasWeb(l) ? "" : `<span class="state off">ابھی نہیں لگی</span>`);
  return `<div class="rec" id="rec-${l}"><div class="rec-top"><b>${esc(L.label)}</b><span class="sub">${mins}</span>${state}</div>
    ${btns.length ? `<div class="btns">${btns.join("")}</div>` : ""}</div>`;
}
function sheetAll() {
  sheetMode = "all";
  const anyWeb = usedLessons.some(hasWeb);
  const hint = anyWeb && !OPUS_OK ? NO_OPUS : "کسی سبز وقت پر ٹیپ کریں تو استاد کی آواز اسی صفحے پر وہیں سے چلتی ہے۔";
  const missing = usedLessons.filter((l) => !hasWeb(l)).length;
  const all = filesOf(usedLessons.filter(hasWeb));
  const mb = all.reduce((a, f) => a + (f.mb || 0), 0);
  const dlAll = all.length > 1 ? `<div class="dlall"><div class="btns"><button type="button" class="btn" data-dl="*">${ICON.down}سب ڈاؤن لوڈ کریں</button>
      <span class="sub">${usedLessons.filter(hasWeb).length} اسباق، ${all.length} فائلیں، کل ${sizeMB(mb)}</span></div>
      <span class="dlstat" id="dlstat" hidden></span></div>` : "";
  $("sheet").innerHTML = `
    <div class="sheet-head"><h3 id="sheetTitle">ریکارڈنگز</h3><button type="button" class="x" data-close aria-label="بند کریں">✕</button></div>
    <p>${hint}${missing ? ` ${missing} اسباق کی ریکارڈنگ ابھی اس صفحے پر نہیں لگی۔` : ""}</p>
    ${dlAll}
    <div>${usedLessons.map(recRow).join("")}</div>`;
  if (dlBusy) markBusy();
  $("backdrop").hidden = false;
}
function sheetOne(l, ts) {
  sheetMode = "one";
  const L = LES[l];
  const why = hasWeb(l) && !OPUS_OK ? NO_OPUS : "اس سبق کی ریکارڈنگ ابھی اس صفحے پر نہیں لگی۔";
  $("sheet").innerHTML = `
    <div class="sheet-head"><h3 id="sheetTitle">یہ حصہ ${esc(L.label)} کی ریکارڈنگ میں <span class="ltr">${ts}</span> پر ہے</h3><button type="button" class="x" data-close aria-label="بند کریں">✕</button></div>
    <p>${why}</p>
    <button type="button" class="linkbtn" data-allrecs style="margin-inline-start:0">سب ریکارڈنگز</button>`;
  $("backdrop").hidden = false;
  $("sheet").querySelector("[data-close]").focus();
}
function closeSheet() { $("backdrop").hidden = true; sheetMode = null; }

// downloads: every part of a lesson, or every lesson of this kitab, one after another.
// Phones ask once to allow several downloads from this site.
function filesOf(ls) {
  return ls.flatMap((l) => LES[l].web.map((p, i, all) => {
    const ext = (p.src.match(/\.\w+$/) || [".ogg"])[0];
    return { src: p.src, mb: p.mb, name: `${l} ${B.book}${all.length > 1 ? ` - حصہ ${i + 1}` : ""}${ext}` };
  }));
}
let dlBusy = false;
function markBusy() { $("sheet").querySelectorAll("[data-dl]").forEach((b) => { b.disabled = dlBusy; }); }
function dlStatus(html) { const s = $("dlstat"); if (s) { s.hidden = !html; s.innerHTML = html || ""; } }
async function runDownloads(files) {
  if (dlBusy || !files.length) return;
  dlBusy = true; markBusy();
  const allow = files.length > 1 ? " براؤزر «کئی فائلیں ڈاؤن لوڈ کریں؟» پوچھے تو Allow دبائیں۔" : "";
  for (let i = 0; i < files.length; i++) {
    dlStatus(`فائل <span class="ltr num">${i + 1} / ${files.length}</span> ڈاؤن لوڈ کے لیے بھیجی جا رہی ہے…${allow}`);
    const a = document.createElement("a");
    a.href = files[i].src; a.download = files[i].name; a.hidden = true;
    document.body.appendChild(a); a.click(); a.remove();
    await new Promise((r) => setTimeout(r, 1200));
  }
  dlBusy = false; markBusy();
  dlStatus(files.length > 1
    ? `${files.length} فائلیں بھیج دی گئیں؛ فون کے Downloads میں دیکھیں۔ اگر کم آئیں تو براؤزر کی سیٹنگ میں اس سائٹ کو <span class="ltr">Automatic downloads</span> کی اجازت دے کر دوبارہ دبائیں۔`
    : "");
}
$("recBtn").addEventListener("click", sheetAll);
$("backdrop").addEventListener("click", (e) => {
  if (e.target === $("backdrop") || e.target.closest("[data-close]")) closeSheet();
  else if (e.target.closest("[data-allrecs]")) sheetAll();
  else if (e.target.closest("[data-dl]")) {
    const k = e.target.closest("[data-dl]").dataset.dl;
    runDownloads(filesOf(k === "*" ? usedLessons.filter(hasWeb) : [k]));
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("backdrop").hidden) closeSheet(); });

function playAt(l, ts) {
  if (!l || !LES[l]) return;
  const sec = secs(ts);
  if (!webOk(l)) { sheetOne(l, ts); return; }
  const p = webPart(l, sec), src = blobUrls[p.src] || p.src, offset = sec - p.start;
  curPart = p;
  closeSheet();
  current = l; lastOffset = Math.max(0, offset);
  $("player").hidden = false;
  if (audio.dataset.src !== src) { audio.dataset.src = src; audio.src = src; pendingSeek = lastOffset; }
  else if (audio.readyState >= 1) {
    if (!blobUrls[curPart.src] && !canSeekTo(lastOffset)) { pendingSeek = lastOffset; useBlob(); return; }
    try { audio.currentTime = lastOffset; } catch (e) {}
  } else pendingSeek = lastOffset;
  audio.play().catch(() => {});
  $("now").innerHTML = `${esc(LES[l].label)} · <span class="ltr">${ts}</span>`;
}
function canSeekTo(o) { const r = audio.seekable; return o < 1 || (r && r.length && r.end(r.length - 1) >= o - 1); }
audio.addEventListener("loadedmetadata", () => {
  const on = document.querySelector("#speeds button[aria-pressed='true']");
  if (on) audio.playbackRate = +on.dataset.rate;
  if (pendingSeek === null) return;
  const o = pendingSeek;
  if (curPart && !blobUrls[curPart.src] && !canSeekTo(o)) { useBlob(); return; }
  pendingSeek = null;
  try { audio.currentTime = o; } catch (e) {}
  audio.play().catch(() => {});
});
audio.addEventListener("error", () => useBlob());
async function useBlob() {   // the server can't jump to the time (or the stream failed): fetch the light copy whole
  const p = curPart;
  if (!p || blobUrls[p.src] || triedBlob[p.src]) return;
  triedBlob[p.src] = true;
  const label = $("now").innerHTML;
  $("now").textContent = "آواز لوڈ ہو رہی ہے…";
  try {
    const r = await fetch(p.src);
    if (!r.ok) throw new Error(r.status);
    blobUrls[p.src] = URL.createObjectURL(await r.blob());
    if (curPart !== p) return;
    audio.dataset.src = blobUrls[p.src]; audio.src = blobUrls[p.src]; pendingSeek = lastOffset;
    audio.play().catch(() => {});
    $("now").innerHTML = label;
  } catch (e) { $("now").textContent = "یہ آواز نہیں چل سکی؛ انٹرنیٹ دیکھ کر دوبارہ ٹیپ کریں۔"; }
}
$("pclose").addEventListener("click", () => { audio.pause(); $("player").hidden = true; });

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-ts]");
  if (!b) return;
  playAt(b.dataset.l, b.dataset.ts);
  const card = b.closest("article.card");
  if (card) { card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash"); }
});
$("speeds").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-rate]");
  if (!b) return;
  audio.playbackRate = +b.dataset.rate;
  document.querySelectorAll("#speeds button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
});
// files people picked on earlier versions of this page: free the space on their phone
try { if (window.indexedDB) indexedDB.deleteDatabase(`${KEY}-audio`); } catch (e) {}
try { localStorage.removeItem(`${KEY}-remember`); } catch (e) {}
</script>
