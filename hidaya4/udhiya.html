<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>كتاب الأضحية · ہدایہ جلد رابع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap">
<style>
/* One kitab of a book. Two views on one page:
   فہرست (contents, styled like the book's own contents page: title … page) and a unit view (one bab/fasl,
   its cards, page chips). Recordings live in a bottom sheet behind the header button. */
:root {
  --paper: #FDFCFB; --surface: #FFFFFF; --ink: #1F1A1B; --muted: #6E6566; --rule: #E9E3E2;
  --matn: #A3211A; --matn-tint: #FBEDEB; --teacher: #17624C; --teacher-tint: #E3F2EC;
  --book: #2B4B7E; --book-tint: #E8EEF8; --note: #545A68; --note-tint: #EDEEF2;
  --ai: #8A5A00; --ai-tint: #FBF0DA; --focus: #2B4B7E;
  --shadow: 0 1px 2px rgba(31,26,27,.05), 0 4px 16px rgba(31,26,27,.05);
  --urdu: "Noto Nastaliq Urdu", "Jameel Noori Nastaleeq", "Urdu Typesetting", "Noto Naskh Arabic", serif;
  --ui: "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
  --arabic: "Amiri", "Noto Naskh Arabic", "Traditional Arabic", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #141112; --surface: #1D191A; --ink: #EFE9E8; --muted: #A99F9F; --rule: #342E2F;
    --matn: #F07B6F; --matn-tint: #3A1F1D; --teacher: #5CC7A2; --teacher-tint: #173229;
    --book: #93B2EA; --book-tint: #1C2638; --note: #A7ADBA; --note-tint: #262831;
    --ai: #E7B25B; --ai-tint: #34290F; --focus: #93B2EA; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #141112; --surface: #1D191A; --ink: #EFE9E8; --muted: #A99F9F; --rule: #342E2F;
  --matn: #F07B6F; --matn-tint: #3A1F1D; --teacher: #5CC7A2; --teacher-tint: #173229;
  --book: #93B2EA; --book-tint: #1C2638; --note: #A7ADBA; --note-tint: #262831;
  --ai: #E7B25B; --ai-tint: #34290F; --focus: #93B2EA; --shadow: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 15px; padding-inline: 16px; padding-block: 0 110px; }
.wrap { max-width: 760px; margin: 0 auto; }
[lang="ar"] { font-family: var(--arabic); }
button, input, a.btn { font: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.ltr { direction: ltr; unicode-bidi: isolate; }
.num { font-variant-numeric: tabular-nums; }

/* header */
header.top { padding-block: 14px 8px; display: grid; gap: 4px; }
.topbar { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.homelink { color: var(--book); font-size: 13.5px; font-weight: 600; text-decoration: none; padding-block: 6px; }
.homelink:hover { text-decoration: underline; }
.recbtn { margin-inline-start: auto; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--rule);
  background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 14px; font-size: 13.5px; font-weight: 600; }
.recbtn svg { width: 15px; height: 15px; fill: none; stroke: var(--teacher); stroke-width: 1.7; stroke-linecap: round; }
.recbtn:hover { border-color: var(--teacher); }
h1 { margin: 6px 0 0; font-family: var(--arabic); font-weight: 700; color: var(--matn); font-size: clamp(36px, 8vw, 50px); line-height: 1.25; }
.meta { color: var(--muted); font-size: 13.5px; line-height: 1.9; margin: 0; }
.meta b { color: var(--ink); font-weight: 600; }

/* contents (فہرست) */
.tochead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-block: 14px 4px; }
.tochead h2 { margin: 0; font-size: 15px; font-weight: 700; color: var(--muted); }
form.jump { display: flex; gap: 4px; margin-inline-start: auto; }
form.jump input { inline-size: 92px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 999px;
  padding: 5px 12px; font-size: 14px; font-variant-numeric: tabular-nums; direction: ltr; text-align: center; }
form.jump button { cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 999px; padding: 5px 13px; font-size: 13.5px; }
.msg { margin: 8px 0 0; color: var(--ink); background: var(--ai-tint); border-radius: 8px; padding: 7px 12px; font-size: 13.5px; line-height: 1.9; }
.msg a { color: var(--book); font-weight: 600; }
ol.toc { list-style: none; margin: 6px 0 0; padding: 0; border-top: 1px solid var(--rule); }
.toc li { border-bottom: 1px solid var(--rule); padding-block: 10px 9px; display: grid; gap: 4px; }
.toc li.lv3 { padding-inline-start: 22px; }
.toc a.row { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: inherit; }
.toc .tt { font-family: var(--arabic); line-height: 1.6; }
.toc li.lv1 .tt { font-size: 23px; color: var(--matn); font-weight: 700; }
.toc li.lv2 .tt { font-size: 20px; font-weight: 700; }
.toc li.lv3 .tt { font-size: 18.5px; }
.toc .dots { flex: 1 1 24px; min-inline-size: 24px; border-bottom: 2px dotted var(--rule); transform: translateY(-5px); }
.toc .pp { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.toc a.row:hover .tt, .toc a.row:focus-visible .tt { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
.toc .sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.toc .sub .n { margin-inline-end: 4px; }
.toc .sub .none { color: var(--ai); }
.toc .sub .exn { color: var(--matn); font-weight: 600; margin-inline-end: 4px; }
a.pchip { text-decoration: none; color: var(--ink); border: 1px solid var(--rule); background: var(--surface); border-radius: 999px; padding: 0 9px;
  font-size: 12.5px; line-height: 1.9; font-variant-numeric: tabular-nums; }
a.pchip:hover { border-color: var(--ink); }

/* unit view */
.ubar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); margin-inline: -16px; padding: 8px 16px 8px;
  border-bottom: 1px solid var(--rule); display: grid; gap: 6px; }
.ubar-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.back { flex: none; cursor: pointer; text-decoration: none; color: var(--book); font-size: 13.5px; font-weight: 600; border: 1px solid var(--rule); border-radius: 999px; padding: 3px 12px; background: var(--surface); }
.utitle { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--arabic); font-size: 19px; font-weight: 700; line-height: 1.6; }
.pbar { display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none; }
.pbar::-webkit-scrollbar { display: none; }
.pbar a { flex: none; text-decoration: none; border: 1px solid var(--rule); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 3px 13px; font-size: 14px; font-variant-numeric: tabular-nums; }
.pbar a[aria-current="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.ubar form.jump input { inline-size: 70px; padding: 3px 8px; }
.ubar form.jump button { padding: 3px 10px; }
.ubar form.jump { flex: none; }
body.unit h1 { font-size: 26px; margin-top: 0; }
body.unit header .meta { display: none; }
.uhead { padding-block: 16px 0; display: grid; gap: 2px; }
.uhead .parent { margin: 0; font-family: var(--arabic); color: var(--muted); font-size: 16px; }
.uhead h2 { margin: 0; font-family: var(--arabic); color: var(--matn); font-size: clamp(26px, 6vw, 32px); line-height: 1.5; }
.uhead p.meta { margin: 0; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; padding-block: 12px 0; color: var(--muted); font-size: 12.5px; align-items: center; }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.linkbtn { cursor: pointer; background: none; border: 0; color: var(--book); font-weight: 600; font-size: 13px; padding: 4px 0; margin-inline-start: auto; }

main { display: grid; gap: 18px; padding-block: 14px; }
article.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; box-shadow: var(--shadow); padding: 18px 18px 14px; display: grid; gap: 12px; }
.card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.pg { font-size: 12.5px; font-weight: 600; color: var(--matn); background: var(--matn-tint); border-radius: 6px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.v7 { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.cnum { color: var(--muted); font-size: 12.5px; }
.badge { font-size: 12px; font-weight: 600; color: var(--book); background: var(--book-tint); border-radius: 999px; padding: 1px 9px; }
.badge.exam { color: var(--matn); background: var(--matn-tint); border: 0; font-family: inherit; line-height: inherit; }
button.badge.exam { cursor: pointer; }
.les { color: var(--muted); font-size: 12.5px; margin-inline-start: auto; }
.play { cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--teacher); color: var(--teacher); background: transparent;
  border-radius: 999px; padding: 3px 11px; font-size: 13px; font-variant-numeric: tabular-nums; direction: ltr; }
.play svg { width: 10px; height: 10px; fill: currentColor; }
.norec-chip { margin-inline-start: auto; color: var(--ai); background: var(--ai-tint); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 600; }
.label { margin: 0; font-family: var(--arabic); color: var(--book); font-size: 15px; line-height: 1.7; }
h3.title { margin: 0; font-size: 19px; font-weight: 700; line-height: 1.7; text-wrap: balance; }
.start { margin: 0; font-family: var(--arabic); font-size: 21px; line-height: 1.9; color: var(--matn); border-inline-start: 3px solid var(--matn); padding-inline-start: 12px; }
.ref { margin: -4px 0 0; color: var(--book); font-size: 13px; line-height: 1.9; }
.start-note { margin: -6px 0 0; color: var(--muted); font-size: 12.5px; line-height: 1.8; }
.norec { margin: 0; background: var(--ai-tint); color: var(--ink); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; line-height: 1.9; }
.norec b { color: var(--ai); }
.sec { display: grid; gap: 6px; }
.sec h4 { margin: 0; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.sec ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.sec li { font-family: var(--urdu); font-size: 16px; line-height: 2.35; }
.sec.tamheed li { font-size: 16.5px; }
.sec.masala li { font-weight: 600; }
.srcs { display: inline-flex; flex-wrap: wrap; gap: 4px; vertical-align: middle; margin-inline-start: 4px; }
.chip { font-family: var(--ui); font-size: 11.5px; line-height: 1.6; border-radius: 5px; padding: 0 6px; white-space: nowrap; font-variant-numeric: tabular-nums; border: 0; font-weight: 600; }
.chip.u { background: var(--teacher-tint); color: var(--teacher); cursor: pointer; }
.chip.k { background: var(--book-tint); color: var(--book); }
.chip.s { background: var(--note-tint); color: var(--note); }
.chip.a { background: var(--ai-tint); color: var(--ai); }
/* in the "سب" view a card opens folded: head, title, Arabic start and the note under it; the rest behind .ctoggle */
.ctoggle { display: none; cursor: pointer; align-items: center; gap: 6px 10px; inline-size: 100%; background: none; border: 0; border-top: 1px dashed var(--rule);
  padding: 8px 0 2px; color: var(--book); font-weight: 600; font-size: 13.5px; text-align: start; }
.ctoggle::before { content: "−"; display: inline-grid; place-items: center; inline-size: 18px; block-size: 18px; border-radius: 50%; border: 1px solid currentColor; font-size: 13px; line-height: 1; }
.ctoggle[aria-expanded="false"]::before { content: "+"; }
body.allview .ctoggle { display: flex; }
.cbody { display: grid; gap: 12px; }
article.card.folded .cbody { display: none; }
article.card { scroll-margin-top: 112px; }
.dlall { display: grid; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--teacher-tint); }
.dlall .btns { align-items: center; }
.dlall .sub { color: var(--muted); font-size: 12.5px; }
.dlall .dlstat { font-size: 12.5px; color: var(--ink); line-height: 1.9; }
.btn[disabled] { opacity: .55; cursor: default; }
details.more { border-top: 1px dashed var(--rule); padding-top: 8px; }
details.more > summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--book); font-weight: 600; font-size: 13.5px; padding-block: 2px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "+"; display: inline-grid; place-items: center; inline-size: 18px; block-size: 18px; border-radius: 50%; border: 1px solid currentColor; font-size: 13px; line-height: 1; }
details.more[open] > summary::before { content: "−"; }
details.more > summary .hint { color: var(--muted); font-weight: 400; font-size: 12.5px; }
details.more > .inner { display: grid; gap: 12px; padding-top: 10px; }
.words { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 14px; }
.word { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; padding-block: 4px; border-bottom: 1px solid var(--rule); }
.word .ar { font-family: var(--arabic); font-size: 19px; color: var(--matn); }
.word .ur { font-family: var(--urdu); font-size: 14.5px; line-height: 2.2; flex: 1 1 auto; }
.word .chip { font-size: 10.5px; }

section.gaps { display: grid; gap: 8px; margin-block-start: 6px; border: 1px dashed var(--rule); border-radius: 12px; padding: 12px 14px; }
section.gaps h3 { margin: 0; font-size: 14.5px; }
section.gaps p.lead { margin: 0; color: var(--muted); font-size: 12.5px; line-height: 1.9; }
.glist { margin: 0; padding: 0; list-style: none; display: grid; }
.glist li { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: start; padding-block: 8px; border-top: 1px solid var(--rule); }
.glist .gp { font-size: 12px; font-weight: 600; color: var(--ai); background: var(--ai-tint); border-radius: 6px; padding: 1px 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.glist .gt { font-family: var(--urdu); font-size: 14.5px; line-height: 2.2; }
.glist .gv { grid-column: 2; color: var(--muted); font-size: 12px; }

nav.unav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-block-start: 18px; }
nav.unav a { display: grid; gap: 2px; text-decoration: none; color: inherit; border: 1px solid var(--rule); border-radius: 12px; padding: 10px 14px; background: var(--surface); }
nav.unav a:hover { border-color: var(--ink); }
nav.unav .k { color: var(--muted); font-size: 12px; }
nav.unav .t { font-family: var(--arabic); font-size: 17px; line-height: 1.6; }
nav.unav a.next { text-align: left; grid-column: 2; }

footer { margin-block-start: 28px; color: var(--muted); font-size: 13px; line-height: 2; border-top: 1px solid var(--rule); padding-block-start: 14px; }
footer p { margin: 0 0 6px; }

/* sheet */
.backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.38); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); color: var(--ink); inline-size: 100%; max-inline-size: 600px; max-block-size: 88vh; overflow-y: auto; border-radius: 16px 16px 0 0;
  padding: 16px 18px calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; box-shadow: 0 -8px 30px rgba(0,0,0,.2); }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet h3 { margin: 0; font-size: 17px; line-height: 1.7; }
.sheet .x { margin-inline-start: auto; cursor: pointer; border: 1px solid var(--rule); background: transparent; color: var(--ink); border-radius: 999px; inline-size: 34px; block-size: 34px; font-size: 18px; line-height: 1; }
.sheet p { margin: 0; font-size: 13.5px; line-height: 1.95; color: var(--muted); }
.sheet p b { color: var(--ink); }
.rec { display: grid; gap: 6px; padding-block: 10px; border-top: 1px solid var(--rule); }
.rec-top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.rec-top b { font-size: 14.5px; }
.rec-top .sub { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.state { font-size: 12px; font-weight: 600; border-radius: 5px; padding: 0 7px; }
.state.on { color: var(--teacher); background: var(--teacher-tint); }
.state.off { color: var(--muted); border: 1px solid var(--rule); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-decoration: none; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--teacher);
  background: var(--teacher); color: var(--surface); font-weight: 600; font-size: 13.5px; line-height: 1.6; }
.btn.ghost { background: transparent; color: var(--teacher); }
.btn svg { width: 12px; height: 12px; fill: currentColor; flex: none; }

/* player */
.player { position: fixed; inset-inline: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--rule); padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; justify-content: center; }
.player audio { flex: 1 1 280px; max-width: 520px; height: 36px; }
.speeds { display: flex; gap: 4px; direction: ltr; }
.speeds button, .pclose { cursor: pointer; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 6px; padding: 3px 8px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.speeds button[aria-pressed="true"] { background: var(--teacher); color: var(--surface); border-color: var(--teacher); }
.now { font-size: 12.5px; color: var(--muted); }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--teacher); } to { box-shadow: var(--shadow); } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; } }
@media (max-width: 460px) {
  article.card { padding: 14px 14px 10px; }
  .start { font-size: 19px; }
  .sec li { font-size: 15.5px; }
  .toc li.lv3 { padding-inline-start: 14px; }
}
</style>
</head>
<body>


<div class="wrap" dir="rtl" lang="ur">
  <header class="top">
    <div class="topbar">
      <a class="homelink" id="homeLink" href="./" hidden></a>
      <button type="button" class="recbtn" id="recBtn" aria-haspopup="dialog">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 10V8a5.5 5.5 0 0 1 11 0v2"/><path d="M2.5 10h2v4h-2zM11.5 10h2v4h-2z"/></svg><span>ریکارڈنگز</span>
      </button>
    </div>
    <h1 lang="ar" id="kitab"></h1>
    <p class="meta" id="meta"></p>
  </header>

  <section id="tocView">
    <div class="tochead">
      <h2>فہرست</h2>
      <form class="jump" data-jump role="search"><input inputmode="numeric" placeholder="صفحہ نمبر" aria-label="صفحہ نمبر"><button type="submit">کھولیں</button></form>
    </div>
    <p class="msg" id="tocMsg" hidden></p>
    <ol class="toc" id="toc"></ol>
  </section>

  <section id="unitView" hidden>
    <div class="ubar">
      <div class="ubar-top"><a class="back" href="#">فہرست</a><span class="utitle" lang="ar" id="ubarTitle"></span>
        <form class="jump" data-jump role="search"><input inputmode="numeric" placeholder="صفحہ" aria-label="صفحہ نمبر"><button type="submit">کھولیں</button></form></div>
      <nav class="pbar" id="pbar" aria-label="صفحات"></nav>
    </div>
    <div class="uhead">
      <p class="parent" lang="ar" id="uParent"></p>
      <h2 lang="ar" id="uTitle"></h2>
      <p class="meta" id="uMeta"></p>
    </div>
    <p class="msg" id="uMsg" hidden></p>
    <div class="legend" id="legend" aria-label="ماخذ کی علامتیں">
      <span class="lg" data-t="u"><span class="chip u">استاد</span><span>ریکارڈنگ کا وقت</span></span>
      <span class="lg" data-t="k"><span class="chip k">کتاب ص</span><span>متن</span></span>
      <span class="lg" data-t="s"><span class="chip s">شرح</span><span>حاشیہ یا بین السطور</span></span>
      <span class="lg" data-t="a"><span class="chip a">AI</span><span>خود جانچیں</span></span>
      <button type="button" class="linkbtn" id="toggleAll" aria-pressed="false">سب تفصیل کھولیں</button>
    </div>
    <main id="cards"></main>

  const l = c.lesson;
  const sec = ([key, label]) => {
    const items = c[key] || [];
    if (!items.length) return "";
    return `<div class="sec ${key}"><h4>${label}</h4><ul>${items.map((it) => `<li>${esc(it.x)} ${chips(it.s, l)}</li>`).join("")}</ul></div>`;
  };
  const quick = DATA.sections.filter(([k]) => QUICK.includes(k)).map(sec).join("");
  const examSecs = DATA.sections.filter(([k]) => !QUICK.includes(k) && (c[k] || []).length);
  const n = examSecs.reduce((a, [k]) => a + c[k].length, 0);
  const exam = n ? `<details class="more"><summary>${examSecs.map(([, lb]) => lb).join("، ")} <span class="hint">${n} نکات، امتحان کی تیاری کے لیے</span></summary><div class="inner">${examSecs.map(sec).join("")}</div></details>` : "";
  const words = (c.lughat || []).length ? `<div class="sec lughat"><h4>مشکل الفاظ</h4><div class="words">${c.lughat.map((w) =>
    `<div class="word"><span class="ar" lang="ar">${esc(w.ar)}</span><span class="ur">${esc(w.ur)}</span>${chips(w.s, l)}</div>`).join("")}</div></div>` : "";
  const head = l && c.ts
    ? `<span class="les">${esc(LES[l].label)}</span><button type="button" class="play" data-ts="${c.ts}" data-l="${l}" aria-label="${esc(LES[l].label)}، ${c.ts} سے سنیں">${ICON.play}${c.ts}</button>`
    : `<span class="norec-chip">ریکارڈنگ نہیں</span>`;
  const badges = (c.badges || []).map((b) => `<span class="badge">${esc(b)}</span>`).join("")
    + (c.exam || []).map((x) => x.k === "t"
      ? `<button type="button" class="badge exam" data-ts="${x.ts}" data-l="${x.l}" title="استاد (${x.ts}): «${esc(x.said)}»" aria-label="استاد نے ${esc(x.kind)} کہا، ${x.ts} سے سنیں">★ استاد: ${esc(x.kind)}</button>`
      : `<span class="badge exam paper" title="${esc(x.q || "")}">★ وفاق ${esc(x.year)}${x.n ? ` · س ${esc(x.n)}` : ""}</span>`).join("");
  const pg = PAGED && c.pages && c.pages.length ? `<span class="pg">${pagesLabel(c.pages)}</span>` : (c.group ? `<span class="pg">${esc(c.group)}</span>` : "");
  return `<article class="card" id="c${i + 1}" data-unit="${esc(c.unit || "")}" data-pages="${(c.pages || []).join("|")}" hidden>
    <div class="card-head">${pg}${c.v7 ? `<span class="v7">${iso(esc(c.v7))}</span>` : ""}<span class="cnum">${esc(ONE)} ${i + 1}</span>${badges}${head}</div>
    ${c.label ? `<p class="label" lang="ar">(${esc(c.label)})</p>` : ""}
    <h3 class="title">${esc(c.title)}</h3>
    <p class="start" lang="ar">«${esc(c.start)}»</p>
    ${c.ref ? `<p class="ref">${esc(c.ref)}</p>` : ""}
    ${c.start_note ? `<p class="start-note">${esc(c.start_note)}</p>` : ""}
    <button type="button" class="ctoggle" aria-expanded="true" aria-controls="cb${i + 1}">تفصیل بند کریں</button>
    <div class="cbody" id="cb${i + 1}">
    ${c.norec ? `<p class="norec"><b>توجہ:</b> ${esc(c.norec)}</p>` : ""}
    ${quick}${words}${exam}
    </div>
  </article>`;
}).join("");
const ARTS = [...document.querySelectorAll("article.card")];
const usedT = new Set();
CARDS.forEach((c) => {
  DATA.sections.forEach(([k]) => (c[k] || []).forEach((it) => it.s.forEach((x) => usedT.add(x.t))));
  (c.lughat || []).forEach((w) => w.s.forEach((x) => usedT.add(x.t)));
});
document.querySelectorAll(".legend .lg").forEach((el) => { el.hidden = !usedT.has(el.dataset.t); });
$("foot").innerHTML = (DATA.footer || []).map((p) => `<p>${esc(p)}</p>`).join("");

// ---------- views
function showToc(msg) {
  $("tocView").hidden = false; $("unitView").hidden = true; document.body.classList.remove("unit");
  $("tocMsg").hidden = !msg; if (msg) $("tocMsg").innerHTML = msg;
  document.title = `${B.kitab} · ${B.book}`;
  const last = store.get(`${KEY}-unit`, "");
  const row = last && $(`toc-${last}`);
  if (row && !msg) row.scrollIntoView({ block: "center" }); else window.scrollTo(0, 0);
}
function showUnit(key, page, msg) {
  const u = unitByKey[key];
  $("tocView").hidden = true; $("unitView").hidden = false; document.body.classList.add("unit");
  const par = u.level > 1 ? parentOf(u) : null;
  $("ubarTitle").textContent = u.title;
  $("uParent").textContent = par ? par.title : "";
  $("uParent").hidden = !par;
  $("uTitle").textContent = u.title;
  const ps = pagesOf(key), n = cardsOf(key).length;
  $("uMeta").innerHTML = (PAGED && u.page ? `ص <span class="ltr num">${range(u.page, u.page_to || u.page)}</span>، ` : "") + (n ? `${n} ${esc(ONE)}` : "ابھی کارڈ نہیں");
  $("pbar").innerHTML = (ps.length > 1 || page ? [`<a href="#${key}" aria-current="${!page}">سب</a>`, ...ps.map((p) =>
    `<a href="#${key}-${p}" aria-current="${page === p}">${p}</a>`)].join("") : "");
  $("pbar").hidden = !$("pbar").innerHTML;
  const allView = !page && !$("pbar").hidden;   // the «سب» chip is selected: cards start folded
  document.body.classList.toggle("allview", allView);
  $("toggleAll").hidden = !allView;
  let shown = 0;
  ARTS.forEach((a) => {
    const on = a.dataset.unit === key && (!page || a.dataset.pages.split("|").includes(String(page)));
    a.hidden = !on; if (on) shown++;
    setFold(a, allView);
  });
  syncToggleAll();
  if (page && !shown && !msg) msg = `صفحہ ${page} کا کوئی ${esc(ONE)} ابھی نہیں بنا۔`;
  $("uMsg").hidden = !msg; if (msg) $("uMsg").innerHTML = msg;
  const gs = gapsOf(key).filter((g) => !page || (g.page_list || []).includes(page));
  $("gaps").hidden = !gs.length;
  $("gapsTitle").textContent = n ? "اس حصے کی وہ عبارت جو استاد نے نہیں سمجھائی" : "اس حصے کی ریکارڈنگ نہیں ملی";
  $("gapsLead").textContent = n ? "یہ باتیں کارڈوں میں متن اور حاشیے سے لکھی گئی ہیں؛ ریکارڈنگ میں ان کی وضاحت نہیں۔"
    : "کسی ساتھی کے پاس اس حصے کی ریکارڈنگ ہو تو بھیج دیں، اس کے کارڈ بھی بن جائیں گے۔";
  $("gapList").innerHTML = gs.map((g) => `<li><span class="gp">${PAGED && g.pages ? "ص " + iso(esc(g.pages)) : ""}</span><span class="gt">${esc(g.text)}</span>${g.v7 ? `<span class="gv">${iso(esc(g.v7))}</span>` : ""}</li>`).join("");
  const i = UNITS.indexOf(u), prev = UNITS[i - 1], next = UNITS[i + 1];
  $("unav").innerHTML = (prev ? `<a class="prev" href="#${prev.key}"><span class="k">پچھلا حصہ</span><span class="t" lang="ar">${esc(prev.title)}</span></a>` : "") +
    (next ? `<a class="next" href="#${next.key}"><span class="k">اگلا حصہ</span><span class="t" lang="ar">${esc(next.title)}</span></a>` : "");
  document.title = `${u.title} · ${B.kitab}`;
  store.set(`${KEY}-unit`, key);
  window.scrollTo(0, 0);
}
function findPage(p) {
  const withCards = UNITS.find((u) => pagesOf(u.key).includes(p));
  if (withCards) return { unit: withCards.key, page: p };
  const inRange = [...UNITS].reverse().find((u) => u.page && u.page <= p && p <= (u.page_to || u.page));
  if (inRange) return { unit: inRange.key, page: p };
  return null;
}
function outsideMsg(p) {
  const k = (DATA.kitabs || []).find((x) => x.from <= p && p <= x.to);
  if (!k) return `صفحہ ${p} اس کتاب میں نہیں۔`;
  if (k.href) return `صفحہ ${p} <a href="${k.href}#p${p}">${esc(k.title)}</a> میں ہے۔`;
  return `صفحہ ${p} «${esc(k.title)}» میں ہے؛ اس کے کارڈ ابھی نہیں بنے۔`;
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  let m;
  if ((m = h.match(/^p(\d+)$/))) {
    const p = +m[1], f = findPage(p);
    if (f) { history.replaceState(null, "", `#${f.unit}-${p}`); return showUnit(f.unit, p); }
    return showToc(outsideMsg(p));
  }
  if ((m = h.match(/^(u\d+)(?:-(\d+))?$/)) && unitByKey[m[1]]) return showUnit(m[1], m[2] ? +m[2] : null);
  if (!h && UNITS.length === 1) return showUnit(UNITS[0].key, null);   // nothing to choose from
  showToc();
}
window.addEventListener("hashchange", route);
document.addEventListener("submit", (e) => {
  const f = e.target.closest("form[data-jump]");
  if (!f) return;
  e.preventDefault();
  const v = toLatin(f.querySelector("input").value || "");
  if (!/^\d+$/.test(v)) return;
  const p = +v, hit = findPage(p);
  if (hit) location.hash = `${hit.unit}-${p}`;
  else showToc(outsideMsg(p));
});
// folding: «سب تفصیل» opens or folds every card shown; each card's دلیل/اختلاف (details.more) stays as the reader left it
function setFold(a, fold) {
  a.classList.toggle("folded", fold);
  const t = a.querySelector(".ctoggle");
  t.setAttribute("aria-expanded", String(!fold));
  t.textContent = fold ? "تمہید اور تفصیل" : "تفصیل بند کریں";
}
function syncToggleAll() {
  const anyFolded = ARTS.some((a) => !a.hidden && a.classList.contains("folded"));
  $("toggleAll").setAttribute("aria-pressed", String(!anyFolded));
  $("toggleAll").textContent = anyFolded ? "سب تفصیل کھولیں" : "سب تفصیل بند کریں";
}
$("toggleAll").addEventListener("click", () => {
  const anyFolded = ARTS.some((a) => !a.hidden && a.classList.contains("folded"));
  ARTS.forEach((a) => { if (!a.hidden) setFold(a, !anyFolded); });
  syncToggleAll();
});
$("cards").addEventListener("click", (e) => {
  const t = e.target.closest(".ctoggle");
  if (!t) return;
  const a = t.closest("article.card");
  const wasOpen = !a.classList.contains("folded");
  setFold(a, wasOpen);
  if (wasOpen && a.getBoundingClientRect().top < 0) a.scrollIntoView({ block: "start" });   // folding a long card: keep it in view
  syncToggleAll();
});
route();

// ---------- recordings: light (Opus) copies on this site
const hasWeb = (l) => !!(LES[l] && LES[l].web && LES[l].web.length);
const webOk = (l) => hasWeb(l) && (OPUS_OK || !/\.ogg$/i.test(LES[l].web[0].src));
const NO_OPUS = "یہ براؤزر یہاں کی ہلکی فائلیں (Opus) نہیں چلاتا۔ آئی فون پر iOS 18.4 یا نیا ورژن چاہیے؛ اینڈرائیڈ پر Chrome میں کھولیں۔";
let current = null, sheetMode = null;
const blobUrls = {}, triedBlob = {};
let curPart = null, lastOffset = 0, pendingSeek = null;
function webPart(l, sec) {
  let p = LES[l].web[0];
  for (const x of LES[l].web) if (x.start <= sec + 0.5) p = x;
  return p;
}
function recRow(l) {
  const L = LES[l], btns = [];
  if (webOk(l)) btns.push(`<button type="button" class="btn" data-ts="0:00:00" data-l="${l}">${ICON.play}شروع سے سنیں</button>`);
  if (hasWeb(l)) {   // one button per lesson, whatever the number of parts
    const mb = L.web.reduce((a, p) => a + (p.mb || 0), 0);
    btns.push(`<button type="button" class="btn ghost" data-dl="${l}">${ICON.down}ڈاؤن لوڈ${L.web.length > 1 ? ` (${L.web.length} حصے)` : ""}${mb ? ` ${sizeMB(mb)}` : ""}</button>`);
  }
  const mins = L.minutes ? `${Math.round(L.minutes)} منٹ` : "";
  const state = webOk(l) ? `<span class="state on">یہیں چلتی ہے</span>` : (hasWeb(l) ? "" : `<span class="state off">ابھی نہیں لگی</span>`);
  return `<div class="rec" id="rec-${l}"><div class="rec-top"><b>${esc(L.label)}</b><span class="sub">${mins}</span>${state}</div>
    ${btns.length ? `<div class="btns">${btns.join("")}</div>` : ""}</div>`;
}
function sheetAll() {
  sheetMode = "all";
  const anyWeb = usedLessons.some(hasWeb);
  const hint = anyWeb && !OPUS_OK ? NO_OPUS : "کسی سبز وقت پر ٹیپ کریں تو استاد کی آواز اسی صفحے پر وہیں سے چلتی ہے۔";
  const missing = usedLessons.filter((l) => !hasWeb(l)).length;
  const all = filesOf(usedLessons.filter(hasWeb));
  const mb = all.reduce((a, f) => a + (f.mb || 0), 0);
  const dlAll = all.length > 1 ? `<div class="dlall"><div class="btns"><button type="button" class="btn" data-dl="*">${ICON.down}سب ڈاؤن لوڈ کریں</button>
      <span class="sub">${usedLessons.filter(hasWeb).length} اسباق، ${all.length} فائلیں، کل ${sizeMB(mb)}</span></div>
      <span class="dlstat" id="dlstat" hidden></span></div>` : "";
  $("sheet").innerHTML = `
    <div class="sheet-head"><h3 id="sheetTitle">ریکارڈنگز</h3><button type="button" class="x" data-close aria-label="بند کریں">✕</button></div>
    <p>${hint}${missing ? ` ${missing} اسباق کی ریکارڈنگ ابھی اس صفحے پر نہیں لگی۔` : ""}</p>
    ${dlAll}
    <div>${usedLessons.map(recRow).join("")}</div>`;
  if (dlBusy) markBusy();
  $("backdrop").hidden = false;
}
function sheetOne(l, ts) {
  sheetMode = "one";
  const L = LES[l];
  const why = hasWeb(l) && !OPUS_OK ? NO_OPUS : "اس سبق کی ریکارڈنگ ابھی اس صفحے پر نہیں لگی۔";
  $("sheet").innerHTML = `
    <div class="sheet-head"><h3 id="sheetTitle">یہ حصہ ${esc(L.label)} کی ریکارڈنگ میں <span class="ltr">${ts}</span> پر ہے</h3><button type="button" class="x" data-close aria-label="بند کریں">✕</button></div>
    <p>${why}</p>
    <button type="button" class="linkbtn" data-allrecs style="margin-inline-start:0">سب ریکارڈنگز</button>`;
  $("backdrop").hidden = false;
  $("sheet").querySelector("[data-close]").focus();
}
function closeSheet() { $("backdrop").hidden = true; sheetMode = null; }

// downloads: every part of a lesson, or every lesson of this kitab, one after another.
// Phones ask once to allow several downloads from this site.
function filesOf(ls) {
  return ls.flatMap((l) => LES[l].web.map((p, i, all) => {
    const ext = (p.src.match(/\.\w+$/) || [".ogg"])[0];
    return { src: p.src, mb: p.mb, name: `${l} ${B.book}${all.length > 1 ? ` - حصہ ${i + 1}` : ""}${ext}` };
  }));
}
let dlBusy = false;
function markBusy() { $("sheet").querySelectorAll("[data-dl]").forEach((b) => { b.disabled = dlBusy; }); }
function dlStatus(html) { const s = $("dlstat"); if (s) { s.hidden = !html; s.innerHTML = html || ""; } }
async function runDownloads(files) {
  if (dlBusy || !files.length) return;
  dlBusy = true; markBusy();
  const allow = files.length > 1 ? " براؤزر «کئی فائلیں ڈاؤن لوڈ کریں؟» پوچھے تو Allow دبائیں۔" : "";
  for (let i = 0; i < files.length; i++) {
    dlStatus(`فائل <span class="ltr num">${i + 1} / ${files.length}</span> ڈاؤن لوڈ کے لیے بھیجی جا رہی ہے…${allow}`);
    const a = document.createElement("a");
    a.href = files[i].src; a.download = files[i].name; a.hidden = true;
    document.body.appendChild(a); a.click(); a.remove();
    await new Promise((r) => setTimeout(r, 1200));
  }
  dlBusy = false; markBusy();
  dlStatus(files.length > 1
    ? `${files.length} فائلیں بھیج دی گئیں؛ فون کے Downloads میں دیکھیں۔ اگر کم آئیں تو براؤزر کی سیٹنگ میں اس سائٹ کو <span class="ltr">Automatic downloads</span> کی اجازت دے کر دوبارہ دبائیں۔`
    : "");
}
$("recBtn").addEventListener("click", sheetAll);
$("backdrop").addEventListener("click", (e) => {
  if (e.target === $("backdrop") || e.target.closest("[data-close]")) closeSheet();
  else if (e.target.closest("[data-allrecs]")) sheetAll();
  else if (e.target.closest("[data-dl]")) {
    const k = e.target.closest("[data-dl]").dataset.dl;
    runDownloads(filesOf(k === "*" ? usedLessons.filter(hasWeb) : [k]));
  }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("backdrop").hidden) closeSheet(); });

function playAt(l, ts) {
  if (!l || !LES[l]) return;
  const sec = secs(ts);
  if (!webOk(l)) { sheetOne(l, ts); return; }
  const p = webPart(l, sec), src = blobUrls[p.src] || p.src, offset = sec - p.start;
  curPart = p;
  closeSheet();
  current = l; lastOffset = Math.max(0, offset);
  $("player").hidden = false;
  if (audio.dataset.src !== src) { audio.dataset.src = src; audio.src = src; pendingSeek = lastOffset; }
  else if (audio.readyState >= 1) {
    if (!blobUrls[curPart.src] && !canSeekTo(lastOffset)) { pendingSeek = lastOffset; useBlob(); return; }
    try { audio.currentTime = lastOffset; } catch (e) {}
  } else pendingSeek = lastOffset;
  audio.play().catch(() => {});
  $("now").innerHTML = `${esc(LES[l].label)} · <span class="ltr">${ts}</span>`;
}
function canSeekTo(o) { const r = audio.seekable; return o < 1 || (r && r.length && r.end(r.length - 1) >= o - 1); }
audio.addEventListener("loadedmetadata", () => {
  const on = document.querySelector("#speeds button[aria-pressed='true']");
  if (on) audio.playbackRate = +on.dataset.rate;
  if (pendingSeek === null) return;
  const o = pendingSeek;
  if (curPart && !blobUrls[curPart.src] && !canSeekTo(o)) { useBlob(); return; }
  pendingSeek = null;
  try { audio.currentTime = o; } catch (e) {}
  audio.play().catch(() => {});
});
audio.addEventListener("error", () => useBlob());
async function useBlob() {   // the server can't jump to the time (or the stream failed): fetch the light copy whole
  const p = curPart;
  if (!p || blobUrls[p.src] || triedBlob[p.src]) return;
  triedBlob[p.src] = true;
  const label = $("now").innerHTML;
  $("now").textContent = "آواز لوڈ ہو رہی ہے…";
  try {
    const r = await fetch(p.src);
    if (!r.ok) throw new Error(r.status);
    blobUrls[p.src] = URL.createObjectURL(await r.blob());
    if (curPart !== p) return;
    audio.dataset.src = blobUrls[p.src]; audio.src = blobUrls[p.src]; pendingSeek = lastOffset;
    audio.play().catch(() => {});
    $("now").innerHTML = label;
  } catch (e) { $("now").textContent = "یہ آواز نہیں چل سکی؛ انٹرنیٹ دیکھ کر دوبارہ ٹیپ کریں۔"; }
}
$("pclose").addEventListener("click", () => { audio.pause(); $("player").hidden = true; });

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-ts]");
  if (!b) return;
  playAt(b.dataset.l, b.dataset.ts);
  const card = b.closest("article.card");
  if (card) { card.classList.remove("flash"); void card.offsetWidth; card.classList.add("flash"); }
});
$("speeds").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-rate]");
  if (!b) return;
  audio.playbackRate = +b.dataset.rate;
  document.querySelectorAll("#speeds button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
});
// files people picked on earlier versions of this page: free the space on their phone
try { if (window.indexedDB) indexedDB.deleteDatabase(`${KEY}-audio`); } catch (e) {}
try { localStorage.removeItem(`${KEY}-remember`); } catch (e) {}
</script>
