name: audio
# Adds the Opus audio of newly carded Hidaya 4 lessons to the site, so night card runs never have to copy it
# (the Claude sandbox blocks copying files from the private wifaq-data repo into this public one; this job is allowed to).
# Runs when card files are pushed, after the daily workflow, and by hand. Secret: WIFAQ_DATA_TOKEN (read access to wifaq-data).
on:
  push:
    branches: [main]
    paths: ['src/cards/h4/h4_*.py']
  workflow_run:
    workflows: [daily]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WIFAQ_DATA_TOKEN: ${{ secrets.WIFAQ_DATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone wifaq-data (blobless, sparse)
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${WIFAQ_DATA_TOKEN}@github.com/safiullahhusaini/wifaq-data" ../wifaq-data
          git -C ../wifaq-data sparse-checkout set --no-cone '/audio/index.csv' '/ocr/Al Hidayah Vol-7/' '/ocr/Al Hidayah Vol-8/'
      - name: Fetch only the audio that is missing from the site
        id: need
        run: |
          python3 src/colab/daily/publish_audio.py ../wifaq-data . --need > /tmp/need.txt
          cat /tmp/need.txt
          if [ -s /tmp/need.txt ]; then
            sed 's#^#/#' /tmp/need.txt | xargs -d '\n' git -C ../wifaq-data sparse-checkout add
          fi
      - name: Copy the audio, rebuild the pages, push
        run: |
          pip -q install rapidfuzz numpy scipy
          mkdir -p .cache
          ln -sfn "$PWD/../wifaq-data/ocr/Al Hidayah Vol-7" .cache/v7ocr
          ln -sfn "$PWD/../wifaq-data/ocr/Al Hidayah Vol-8" .cache/v8ocr
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            rm -f /tmp/out.txt; GITHUB_OUTPUT=/tmp/out.txt python3 src/colab/daily/publish_audio.py ../wifaq-data .
            grep -q 'changed=true' /tmp/out.txt || exit 0
            (cd src/cards && python3 build_site.py | tail -2)
            git add -A hidaya4 index.html src/cards/h4_pagemap_cache.json
            git commit -qm "audio: new lessons (audio.yml)"
            git push -q origin main && exit 0
            # someone pushed meanwhile: start again from the new main (the script is idempotent)
            git fetch -q origin main && git reset -q --hard origin/main
            git -C ../wifaq-data sparse-checkout list >/dev/null
          done
          exit 1
