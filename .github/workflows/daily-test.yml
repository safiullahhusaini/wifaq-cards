name: daily-test
on:
  push:
    branches: [ci-daily]
permissions:
  contents: write
jobs:
  secrets-and-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Which secrets exist (names only, never values)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          DATA_TOKEN: ${{ secrets.GITHUB_DATA_TOKEN }}
        run: |
          mkdir -p probe
          { for n in RCLONE_CONF GEMINI_API_KEY VERTEX_API_KEY DATA_TOKEN; do v="${!n}"; echo "$n: ${#v} chars"; done; } | tee probe/secrets.txt
      - name: Install rclone and list Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null 2>&1 || true
          rclone version | head -1
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          { rclone listremotes; echo ---; rclone lsf "gdrive:" --max-depth 1 | head -30; echo ---; rclone lsf "gdrive:Wifaq 1448" --max-depth 1 | head -40; } 2>&1 | tee probe/drive.txt
      - name: Gemini and Vertex key check (list models, HTTP code only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
        run: |
          { echo "aistudio: $(curl -s -o /dev/null -w '%{http_code}' "https://generativelanguage.googleapis.com/v1beta/models?key=$GEMINI_API_KEY")"
            echo "vertex-express: $(curl -s -o /dev/null -w '%{http_code}' "https://aiplatform.googleapis.com/v1/publishers/google/models/gemini-3.8-flash?key=$VERTEX_API_KEY")"; } | tee probe/keys.txt
      - name: Save results
        if: always()
        run: |
          git config user.name "daily-bot"; git config user.email "noreply@github.com"
          git add probe && git commit -m "daily-test results" && git push origin ci-daily || true
