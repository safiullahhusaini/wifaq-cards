name: daily-test
on:
  push:
    branches: [ci-daily]
permissions:
  contents: write
jobs:
  secrets-and-drive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Which secrets exist (names only, never values)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          DATA_TOKEN: ${{ secrets.GITHUB_DATA_TOKEN }}
        run: |
          mkdir -p probe
          { for n in RCLONE_CONF GEMINI_API_KEY VERTEX_API_KEY DATA_TOKEN; do v="${!n}"; echo "$n: ${#v} chars"; done; } | tee probe/secrets.txt
      - name: Inspect rclone config shape (values masked) and try Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          curl -s https://rclone.org/install.sh | sudo bash >/dev/null 2>&1 || true
          rclone version | head -1
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          python3 - <<'PY' | tee probe/conf_shape.txt
          import configparser, json, os
          c = configparser.ConfigParser(); c.read(os.path.expanduser("~/.config/rclone/rclone.conf"))
          for s in c.sections():
              print("section", s)
              for k, v in c[s].items():
                  if k == "token":
                      try:
                          d = json.loads(v); print(" token keys", sorted(d), "expiry", d.get("expiry"), "refresh_len", len(d.get("refresh_token","")), "type", d.get("token_type"))
                      except Exception as e:
                          print(" token NOT JSON:", e, "len", len(v))
                  elif k in ("client_secret", "client_id", "refresh_token", "access_token"):
                      print(" ", k, "len", len(v))
                  else:
                      print(" ", k, "=", v[:40])
          PY
          date -u | tee -a probe/conf_shape.txt
          rclone lsd gdrive: -vv 2>&1 | grep -v "^$" | cut -c1-300 | tail -15 | tee probe/drive.txt
      - name: Gemini and Vertex through the genai library
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
        run: |
          pip -q install google-genai
          python3 - <<'PY' | tee probe/keys.txt
          import os
          from google import genai
          for label, cl in (("aistudio", genai.Client(api_key=os.environ["GEMINI_API_KEY"])), ("vertex", genai.Client(vertexai=True, api_key=os.environ["VERTEX_API_KEY"]))):
              try:
                  r = cl.models.generate_content(model="gemini-3.8-flash", contents="Reply with the single word: ok")
                  print(label, "OK:", (r.text or "")[:40].strip())
              except Exception as e:
                  print(label, "ERROR:", str(e)[:200].replace("\n", " "))
          PY
      - name: Save results
        if: always()
        run: |
          git config user.name "daily-bot"; git config user.email "noreply@github.com"
          git add probe && git commit -m "daily-test results" && git push origin ci-daily || true
